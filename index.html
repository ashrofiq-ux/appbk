function cekKehadiran(){
  var tglEl = $('#khTgl'), kelasEl = $('#khKelas'), listEl = $('#khList'), notifEl = $('#khNotif');
  if(!tglEl || !kelasEl || !listEl) return;
  var tglV = tglEl.value || '';
  var kelas = kelasEl.value || '';
  if(!tglV || !kelas){
    listEl.innerHTML = '<div class="empty">Pilih tanggal dan kelas.</div>';
    if(notifEl){ notifEl.className = 'notif new'; notifEl.innerHTML = '✔ Pilih tanggal & kelas.'; }
    window._khIsEdit = false;
    return;
  }
  listEl.innerHTML = '<div class="empty">Memuat…</div>';
  getHadirRows().then(function(rows){
    rows = rows || [];
    var existing = rows.filter(function(r){
      return String(r.Tanggal) === tglV && String(r.Kelas) === kelas;
    });
    var statusMap = {}, ketMap = {};
    existing.forEach(function(r){
      statusMap[String(r.NIS)] = r.Status;
      ketMap[String(r.NIS)] = r.Keterangan || '';
    });
    var isEdit = existing.length > 0;
    window._khIsEdit = isEdit;
    if(notifEl){
      if(isEdit){
        notifEl.className = 'notif edit';
        notifEl.innerHTML = '⚠️ Data presensi <b>'+esc(kelas)+'</b> pada <b>'+tgl(tglV)+'</b> sudah ada. Mode <b>EDIT</b>.';
      } else {
        notifEl.className = 'notif new';
        notifEl.innerHTML = '✔ Mode <b>TAMBAH BARU</b> — semua siswa otomatis Hadir.';
      }
    }
    renderKehadiranTable(kelas, statusMap, ketMap, !isEdit);
  }).catch(function(e){
    toast('Gagal memuat data presensi: ' + (e.message || e),'er');
    if(listEl) listEl.innerHTML = '<div class="empty">Gagal memuat data.</div>';
  });
}
function renderKehadiranTable(kelas, statusMap, ketMap, autoHadir){
  var listEl = $('#khList');
  if(!listEl) return;
  var list = (ST.siswa||[]).filter(function(s){ return s.Kelas===kelas; })
    .sort(function(a,b){ return a.Nama.localeCompare(b.Nama); });
  if(!list.length){ listEl.innerHTML = '<div class="empty">Tidak ada siswa di kelas ini.</div>'; return; }
  statusMap = statusMap || {};
  ketMap = ketMap || {};
  listEl.innerHTML =
    '<div style="margin-bottom:9px">'+
      '<button class="btn4 btn-sm" onclick="setAllHadir(\'H\')">Semua Hadir</button>'+
      '<button class="btn2 btn-sm" onclick="setAllHadir(\'\')">Reset</button>'+
    '</div>'+
    '<div class="tw"><table><thead><tr><th style="width:44px">No</th><th>Nama Siswa</th>'+
    '<th style="width:280px">Status</th><th style="width:220px">Keterangan</th></tr></thead><tbody>'+
    list.map(function(s,i){
      var cur = statusMap[String(s.NIS)] || (autoHadir ? 'H' : '');
      var ket = ketMap[String(s.NIS)] || '';
      return '<tr data-nis="'+esc(s.NIS)+'" data-nama="'+esc(s.Nama)+'" data-st="'+esc(cur)+'">'+
        '<td>'+(i+1)+'</td><td>'+esc(s.Nama)+'</td>'+
        '<td>'+['H','S','I','A'].map(function(st){
          var checked = (cur === st) ? 'checked' : '';
          return '<label style="display:inline-flex;align-items:center;gap:3px;margin-right:11px;font-weight:500;font-size:12.5px">'+
            '<input type="radio" name="st_'+i+'" value="'+st+'" '+checked+
            ' onchange="this.closest(\'tr\').dataset.st=\''+st+'\'" style="width:auto"> '+st+'</label>';
        }).join('')+'</td>'+
        '<td><input class="ketIn" value="'+esc(ket)+'" style="padding:5px 8px;font-size:12px"></td>'+
      '</tr>';
    }).join('')+
    '</tbody></table></div>';
}
function setAllHadir(v){
  $$('#khList tbody tr').forEach(function(tr){
    tr.dataset.st = v || '';
    var rads = tr.querySelectorAll('input[type=radio]');
    for(var i=0;i<rads.length;i++) rads[i].checked = v ? (rads[i].value === v) : false;
  });
}
function simpanKehadiran(){
  var tglEl = $('#khTgl'), kelasEl = $('#khKelas');
  if(!tglEl || !kelasEl) return;
  var tglV = tglEl.value || '', kelas = kelasEl.value || '';
  if(!tglV || !kelas) return toast('Tanggal dan kelas wajib dipilih','er');
  var rows = [];
  var anySt = false;
  $$('#khList tbody tr').forEach(function(tr){
    var st = tr.dataset.st;
    if(!st) return;
    anySt = true;
    var ketEl = tr.querySelector('.ketIn');
    rows.push({
      Tanggal: tglV, NIS: tr.dataset.nis, Nama: tr.dataset.nama, Kelas: kelas,
      Status: st, Keterangan: ketEl ? ketEl.value.trim() : '',
      Petugas: ST.guru ? ST.guru.Nama : 'Admin'
    });
  });
  if(!anySt) return toast('Belum ada status yang dipilih','er');
  var isEdit = !!window._khIsEdit;
  var doSave = function(){
    var payload = { rows: rows };
    if(isEdit){ payload.replaceDate = tglV; payload.replaceKelas = kelas; }
    api('saveKehadiranBulk', payload).then(function(){
      ST.cache[SH.HADIR] = null; _hadirLoading = null;
      closeModal();
      toast(rows.length + ' data presensi ' + (isEdit ? 'berhasil diperbarui' : 'berhasil disimpan'));
      renderKehadiran();
    }).catch(function(e){ toast(e.message,'er'); });
  };
  if(isEdit) confirmBox('Ganti data presensi lama untuk '+kelas+' tanggal '+tglV+'?', doSave);
  else doSave();
}

function tabelKegiatan(key, rows){

function simpanKegiatan(key, id){
  var d = collectForm(key);
  if(!d) return;
  d.ID = id || uid();
  if(key === 'kelompok' && d.Anggota){
    var nisList = d.Anggota.split(';').map(function(s){ return s.trim().split(' - ')[0].trim(); }).filter(Boolean);
    var kelasSet = {};
    nisList.forEach(function(nis){
      var s = ST.siswa.find(function(x){ return String(x.NIS) === nis; });
      if(s && s.Kelas) kelasSet[s.Kelas] = 1;
    });
    d.Kelas = Object.keys(kelasSet).join(', ');
    d.JumlahAnggota = nisList.length;
  }
  if(key === 'lain' && d.NIS){
    var parts = String(d.NIS).split(';').map(function(s){ return s.trim(); }).filter(Boolean);
    var nisArr = [], namaArr = [], kelasSet2 = {};
    parts.forEach(function(part){
      var idx = part.indexOf(' - ');
      var nis, nama;
      if(idx > 0){ nis = part.substring(0, idx).trim(); nama = part.substring(idx + 3).trim(); }
      else { nis = part; nama = ''; }
      if(!nis) return;
      nisArr.push(nis);
      var s = ST.siswa.find(function(x){ return String(x.NIS) === nis; });
      if(s){
        if(!nama) nama = s.Nama;
        if(s.Kelas) kelasSet2[s.Kelas] = 1;
      }
      if(nama) namaArr.push(nama);
    });
    d.NIS  = nisArr.join('; ');
    d.Nama = namaArr.join('; ');
    d.Kelas = Object.keys(kelasSet2).join(', ');
  }
  api('saveRecord',{sheet:KEG_CFG[key].sheet, data:d}).then(function(){
    closeModal(); toast('Kegiatan berhasil disimpan');
    ST.cache[key] = null; renderKegiatan(key);
  }).catch(function(e){ toast(e.message,'er'); });
}
function hapusKegiatan(key, id){
  confirmBox('Hapus kegiatan ini?', function(){
    api('deleteRecord',{sheet:KEG_CFG[key].sheet, id:id}).then(function(){
      ST.cache[key] = null; toast('Kegiatan dihapus'); renderKegiatan(key);
    }).catch(function(e){ toast(e.message,'er'); });
  });
}
function filterKegiatan(key){
  var dariEl = $('#kDari'), sampaiEl = $('#kSampai'), kelasEl = $('#kKelas');
  var dari = dariEl ? dariEl.value : '';
  var sampai = sampaiEl ? sampaiEl.value : '';
  var kelas = kelasEl ? kelasEl.value : '';
  var r = (ST.cache[key]||[]).filter(function(x){
    if(!x.Kelas) return true;
    var kelasRow = String(x.Kelas).split(',').map(function(y){ return y.trim(); });
    return kelasRow.some(function(k){ return kelasSaya().indexOf(k) >= 0; });
  });
  if(dari)   r = r.filter(function(x){ return String(x.Tanggal)>=dari; });
  if(sampai) r = r.filter(function(x){ return String(x.Tanggal)<=sampai; });
  if(kelas)  r = r.filter(function(x){
    var kelasRow = String(x.Kelas||'').split(',').map(function(y){ return y.trim(); });
    return kelasRow.indexOf(kelas) >= 0;
  });
  ST.cache['v_'+key] = r;
  var tblEl = $('#tblKeg');
  if(tblEl) tblEl.innerHTML = tabelKegiatan(key, r);
}

function ambilSemua(){
  if(ST.cache.lpAll) return Promise.resolve(ST.cache.lpAll);
  var sheets = [SH.IZIN,SH.TERLAMBAT,SH.HADIR,SH.KLASIKAL,SH.KELOMPOK,SH.KR,SH.KONSELING,SH.PANGGILAN,SH.ANEKDOT,SH.KASUS,SH.LAIN];
  var jobs = sheets.map(function(s){
    return api('getData',{sheet:s}).then(function(rows){ return {sheet:s, rows:rows||[]}; })
      .catch(function(){ return {sheet:s, rows:[]}; });
  });
  return Promise.all(jobs).then(function(results){
    var out = {};
    results.forEach(function(r){ out[r.sheet] = r.rows; });
    ST.cache.lpAll = out;
    return out;
  });
}
function lpPeriode(){
  var mode = ST.cache.lpMode || 'bulan';
  var dari = '', sampai = '', label = '';
  if(mode === 'bulan'){
    var b = ST.cache.lpBulan || today().slice(0,7);
    var parts = b.split('-');
    label = 'Bulan ' + monthName(+parts[1]) + ' ' + parts[0];
    dari = b + '-01';
    var lastDay = new Date(+parts[0], +parts[1], 0).getDate();
    sampai = b + '-' + pad2(lastDay);
  } else {
    dari = ST.cache.lpDari || (today().slice(0,7)+'-01');
    sampai = ST.cache.lpSampai || today();
    if(dari > sampai){ var t = dari; dari = sampai; sampai = t; }
    label = 'Rentang ' + tgl(dari) + ' s.d. ' + tgl(sampai);
  }
  return { mode: mode, dari: dari, sampai: sampai, label: label, kelas: ST.cache.lpKelas || '' };
}
function lpFilter(rows, p){
  return (rows || []).filter(function(r){
    var t = String(r.Tanggal||'');
    if(p.dari && t < p.dari) return false;
    if(p.sampai && t > p.sampai) return false;
    var kelasRow = String(r.Kelas||'').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    var ks = kelasSaya();
    if(!kelasRow.some(function(k){ return ks.indexOf(k) >= 0; })) return false;
    if(p.kelas && kelasRow.indexOf(p.kelas) < 0) return false;
    return true;
  });
}

function rekapPerSiswaData(all, p){
  var ks = kelasSaya();
  var siswaFiltered = (ST.siswa||[]).filter(function(s){
    return ks.indexOf(s.Kelas) >= 0 && (!p.kelas || s.Kelas === p.kelas);
  });
  var agg = {};
  siswaFiltered.forEach(function(s){
    agg[String(s.NIS)] = {
      NIS: s.NIS, Nama: s.Nama, Kelas: s.Kelas,
      klasikal:0, kelompok:0, kr:0, konseling:0, panggilan:0, anekdot:0, kasus:0, lain:0
    };
  });
  function ok(t){ return (!p.dari || t >= p.dari) && (!p.sampai || t <= p.sampai); }
  (all[SH.KLASIKAL]||[]).forEach(function(r){
    if(!ok(String(r.Tanggal||''))) return;
    var kelasRow = String(r.Kelas||'').split(',').map(function(x){ return x.trim(); });
    Object.keys(agg).forEach(function(k){
      var a = agg[k];
      if(kelasRow.indexOf(a.Kelas) >= 0) a.klasikal++;
    });
  });
  (all[SH.KELOMPOK]||[]).forEach(function(r){
    if(!ok(String(r.Tanggal||''))) return;
    String(r.Anggota||'').split(';').forEach(function(part){
      var nis = String(part||'').trim().split(' - ')[0].trim();
      if(nis && agg[nis]) agg[nis].kelompok++;
    });
  });
  (all[SH.KR]||[]).forEach(function(r){
    if(!ok(String(r.Tanggal||''))) return;
    var nis = String(r.NIS||'');
    if(agg[nis]) agg[nis].kr++;
  });
  (all[SH.KONSELING]||[]).forEach(function(r){
    if(!ok(String(r.Tanggal||''))) return;
    var nis = String(r.NIS||'');
    if(agg[nis]) agg[nis].konseling++;
  });
  (all[SH.PANGGILAN]||[]).forEach(function(r){
    if(!ok(String(r.Tanggal||''))) return;
    var nis = String(r.NIS||'');
    if(agg[nis]) agg[nis].panggilan++;
  });
  (all[SH.ANEKDOT]||[]).forEach(function(r){
    if(!ok(String(r.Tanggal||''))) return;
    var nis = String(r.NIS||'');
    if(agg[nis]) agg[nis].anekdot++;
  });
  (all[SH.KASUS]||[]).forEach(function(r){
    if(!ok(String(r.Tanggal||''))) return;
    var nis = String(r.NIS||'');
    if(agg[nis]) agg[nis].kasus++;
  });
  (all[SH.LAIN]||[]).forEach(function(r){
    if(!ok(String(r.Tanggal||''))) return;
    String(r.NIS||'').split(';').forEach(function(part){
      var nis = String(part||'').trim().split(' - ')[0].trim();
      if(nis && agg[nis]) agg[nis].lain++;
    });
  });
  var arr = Object.keys(agg).map(function(k){
    var a = agg[k];
    var total = a.klasikal + a.kelompok + a.kr + a.konseling + a.panggilan + a.anekdot + a.kasus + a.lain;
    var detail = [];
    if(a.klasikal)  detail.push('Klasikal('+a.klasikal+')');
    if(a.kelompok)  detail.push('Kelompok('+a.kelompok+')');
    if(a.kr)        detail.push('Home Visit('+a.kr+')');
    if(a.konseling) detail.push('Konseling('+a.konseling+')');
    if(a.panggilan) detail.push('Panggilan OT('+a.panggilan+')');
    if(a.anekdot)   detail.push('Anekdot('+a.anekdot+')');
    if(a.kasus)     detail.push('Kasus('+a.kasus+')');
    if(a.lain)      detail.push('Lain-lain('+a.lain+')');
    return Object.assign(a, { total: total, detailStr: detail.length ? detail.join(', ') : '-' });
  });
  arr = arr.filter(function(x){ return x.total > 0; });
  arr.sort(function(a,b){ return b.total - a.total; });
  return arr;
}
function gabunganSemuaKegiatan(all, p){

  (all[SH.KASUS]||[]).forEach(function(r){

      (r.Nama||'')+' | '+(r.Deskripsi||'-'));

  (all[SH.LAIN]||[]).forEach(function(r){
    push(String(r.Tanggal||''), 'Lain-lain', r.Kelas,
      (r.Nama||'')+' | '+(r.Kegiatan||'-'));

  evts.sort(function(a,b){ return String(b.tanggal).localeCompare(String(a.tanggal)); });

function rpSetMode(){
  var modeEl = $('#rpMode');
  var newMode = modeEl ? modeEl.value : 'bulan';
  var modeChanged = (ST.cache.rpMode !== newMode);
  var k = $('#rpKelas'); if(k) ST.cache.rpKelas = k.value;
  if(modeChanged){
    if(newMode === 'rentang'){
      var b = ST.cache.rpBulan;
      if(b){
        var parts = b.split('-');
        ST.cache.rpDari = b + '-01';
        ST.cache.rpSampai = b + '-' + pad2(new Date(+parts[0], +parts[1], 0).getDate());
      }
    } else if(newMode === 'bulan'){
      var d = ST.cache.rpDari;
      if(d) ST.cache.rpBulan = d.slice(0,7);
    }
    ST.cache.rpMode = newMode;
    renderReport();
    if(ST.cache.rpJenis){
      setTimeout(function(){ rpJenis(ST.cache.rpJenis); }, 30);
    }
    return;
  }
  ST.cache.rpMode = newMode;
  if(newMode === 'bulan'){
    var b2 = $('#rpBulan'); if(b2) ST.cache.rpBulan = b2.value;
  } else {
    var d2 = $('#rpDari'); if(d2) ST.cache.rpDari = d2.value;
    var s2 = $('#rpSampai'); if(s2) ST.cache.rpSampai = s2.value;
  }
  if(ST.cache.rpJenis) rpJenis(ST.cache.rpJenis);
  else renderReport();
}

function rpPeriode(){
  var mode = ST.cache.rpMode || 'bulan';
  var dari = '', sampai = '', label = '';
  if(mode === 'bulan'){
    var b = ST.cache.rpBulan || today().slice(0,7);
    var parts = b.split('-');
    label = 'Bulan ' + monthName(+parts[1]) + ' ' + parts[0];
    dari = b + '-01';
    var lastDay = new Date(+parts[0], +parts[1], 0).getDate();
    sampai = b + '-' + pad2(lastDay);
  } else {
    dari = ST.cache.rpDari || (today().slice(0,7)+'-01');
    sampai = ST.cache.rpSampai || today();
    if(dari > sampai){ var t = dari; dari = sampai; sampai = t; }
    label = 'Rentang ' + tgl(dari) + ' s.d. ' + tgl(sampai);
  }
  return { mode: mode, dari: dari, sampai: sampai, label: label, kelas: ST.cache.rpKelas || '' };
}

  var w = window.open('', '_blank');
  if(!w){ toast('Popup diblokir. Izinkan popup untuk mencetak.','er'); return; }
  var css = '@page{size:A4;margin:1.5cm}'+
    'body{font-family:"Times New Roman",serif;color:#000;font-size:12.5pt;line-height:1.5}'+
    'h2.rptitle{text-align:center;font-size:15pt;margin:14px 0 4px;text-transform:uppercase}'+
    '.rpsub{text-align:center;font-size:11pt;margin-bottom:16px;color:#333}'+
    'table.rp{width:100%;border-collapse:collapse;font-size:11pt;margin-top:10px}'+
    'table.rp th,table.rp td{border:1px solid #000;padding:6px 8px;vertical-align:top;text-align:left}'+
    'table.rp th{background:#e8eef7;font-weight:bold;text-align:center}'+
    'table.rp td{white-space:pre-wrap}'+
    'img{max-width:100%}';
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(judul)+'</title>'+
    '<style>'+css+'</style></head><body>'+
    kopHTML() + bodyHTML + (signatureHTML||'') +
    '<scr'+'ipt>setTimeout(function(){window.print();},600);</scr'+'ipt>'+
    '</body></html>');
  w.document.close();
}
function exportExcel(filename, head, body){
  var html = '<html><head><meta charset="utf-8"></head><body><table border="1" style="font-family:Arial;font-size:11pt">';
  html += '<tr>' + head.map(function(h){ return '<th style="background:#1a73e8;color:#fff;padding:6px">'+esc(h)+'</th>'; }).join('') + '</tr>';
  if(!body.length) html += '<tr><td colspan="'+head.length+'">Tidak ada data</td></tr>';
  body.forEach(function(r){
    html += '<tr>' + r.map(function(c){ return '<td style="padding:5px">'+esc(c==null?'':c)+'</td>'; }).join('') + '</tr>';
  });
  html += '</table></body></html>';
  var blob = new Blob(['\ufeff' + html], {type:'application/vnd.ms-excel;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename.replace(/[^\w\-]+/g,'_') + '.xls';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast('File Excel berhasil diunduh');
}
</script>
