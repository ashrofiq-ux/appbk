<script>
/* =========================================================
   KONSTANTA
   ========================================================= */
var LOGO_URL = 'https://www.smanklirong.sch.id/storage/school-identity/01M1GX0S27524DBWJKADF8FMCA.jpg';
var DB_KEY = 'bk_sman1_klirong_db_v1';
var SESSION_KEY = 'bk_sman1_klirong_session';
var GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

var SH = {
  SETTING:'Setting', KELAS:'Kelas', GURUBK:'GuruBK', SISWA:'Siswa',
  IZIN:'Perizinan', TERLAMBAT:'Keterlambatan', HADIR:'Kehadiran',
  KLASIKAL:'BimbinganKlasikal', KELOMPOK:'BimbinganKelompok',
  KR:'KunjunganRumah', KONSELING:'KonselingIndividual',
  PANGGILAN:'PanggilanOT',
  ANEKDOT:'Anekdot',
  KASUS:'CatatanKasus', LAIN:'LainLain'
};

var ST = { token:null, user:null, guru:null, page:'dashboard',
  kelas:[], gurubk:[], siswa:[], setting:{}, cache:{},
  history: [],
  khTab:'daftar', tlTab:'daftar', izTab:'daftar' };

/* =========================================================
   LOCAL DATABASE (offline, tersimpan di perangkat)
   ========================================================= */
function defaultDB(){
  return {
    version: 1,
    setting: {
      kepalaSekolah:'', nipKepsek:'', guruBK:'', nipGuruBK:'',
      kop:'', ttdBK:'', driveClientId:''
    },
    kelas: [],
    gurubk: [],
    siswa: [],
    users: [
      { username:'admin', password:'admin123', role:'admin', nama:'Administrator' }
    ],
    records: {
      Perizinan: [], Keterlambatan: [], Kehadiran: [],
      BimbinganKlasikal: [], BimbinganKelompok: [], KunjunganRumah: [],
      KonselingIndividual: [], PanggilanOT: [], Anekdot: [], CatatanKasus: [], LainLain: []
    }
  };
}
function loadDB(){
  try{
    var raw = localStorage.getItem(DB_KEY);
    if(!raw) { var db = defaultDB(); saveDB(db); return db; }
    var db = JSON.parse(raw);
    var def = defaultDB();
    db.setting = Object.assign({}, def.setting, db.setting || {});
    db.records = Object.assign({}, def.records, db.records || {});
    if(!Array.isArray(db.kelas)) db.kelas = [];
    if(!Array.isArray(db.gurubk)) db.gurubk = [];
    if(!Array.isArray(db.siswa)) db.siswa = [];
    if(!Array.isArray(db.users) || !db.users.length) db.users = def.users;
    return db;
  }catch(e){
    console.error('DB load error', e);
    var d = defaultDB(); saveDB(d); return d;
  }
}
function saveDB(db){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e){
    console.error(e);
    try{ alert('Penyimpanan perangkat hampir penuh. Silakan backup dan hapus data lama.'); }catch(_){}
  }
}
function getSession(){
  try{
    var s = sessionStorage.getItem(SESSION_KEY);
    return s ? JSON.parse(s) : null;
  }catch(e){ return null; }
}
function setSession(u){
  if(u) sessionStorage.setItem(SESSION_KEY, JSON.stringify(u));
  else sessionStorage.removeItem(SESSION_KEY);
}

/* =========================================================
   LOCAL API (menggantikan backend Google Apps Script)
   ========================================================= */
function localApi(action, payload){
  var db = loadDB();
  payload = payload || {};
  switch(action){

    case 'login': {
      var u = String(payload.username||'').trim();
      var p = String(payload.password||'');
      var found = null;
      for(var i=0;i<db.users.length;i++){
        if(String(db.users[i].username).toLowerCase() === u.toLowerCase() && String(db.users[i].password) === p){
          found = { username:db.users[i].username, role:db.users[i].role, nama:db.users[i].nama||'Administrator', guru:null };
          break;
        }
      }
      if(!found){
        for(var j=0;j<db.gurubk.length;j++){
          var g = db.gurubk[j];
          if(String(g.Username||'').toLowerCase() === u.toLowerCase() && String(g.Password||'') === p){
            found = { username:g.Username, role:'gurubk', nama:g.Nama, guru:g };
            break;
          }
        }
      }
      if(!found) throw new Error('Username atau password salah');
      var token = 'tk_' + uid();
      setSession(found);
      return { token: token, role: found.role, guru: found.guru, username: found.username, nama: found.nama };
    }

    case 'bootstrap': {
      var sess = getSession();
      var guruOut = null;
      if(sess && sess.role === 'gurubk' && sess.guru && sess.guru.ID){
        for(var i=0;i<db.gurubk.length;i++){
          if(String(db.gurubk[i].ID) === String(sess.guru.ID)){ guruOut = db.gurubk[i]; break; }
        }
      }
      return {
        kelas: db.kelas.slice(),
        gurubk: db.gurubk.slice(),
        setting: db.setting,
        siswa: db.siswa.slice(),
        guru: guruOut
      };
    }

    case 'getData': {
      var sheet = payload.sheet;
      return (db.records[sheet] || []).slice();
    }

    case 'saveRecord': {
      var sheet = payload.sheet, data = Object.assign({}, payload.data || {});
      if(!db.records[sheet]) db.records[sheet] = [];
      var idx = -1;
      if(data.ID){
        for(var i=0;i<db.records[sheet].length;i++){
          if(String(db.records[sheet][i].ID) === String(data.ID)){ idx = i; break; }
        }
      }
      if(idx >= 0){
        db.records[sheet][idx] = Object.assign({}, db.records[sheet][idx], data);
      } else {
        if(!data.ID) data.ID = uid();
        db.records[sheet].push(data);
      }
      saveDB(db);
      return { ok:true, id: data.ID };
    }

    case 'deleteRecord': {
      var sheet = payload.sheet, id = payload.id;
      if(!db.records[sheet]) return { ok:true };
      db.records[sheet] = db.records[sheet].filter(function(r){ return String(r.ID) !== String(id); });
      saveDB(db);
      return { ok:true };
    }

    case 'updateRecord': {
      var sheet = payload.sheet, id = payload.id, data = payload.data || {};
      if(!db.records[sheet]) return { ok:true };
      for(var i=0;i<db.records[sheet].length;i++){
        if(String(db.records[sheet][i].ID) === String(id)){
          db.records[sheet][i] = Object.assign({}, db.records[sheet][i], data);
          break;
        }
      }
      saveDB(db);
      return { ok:true };
    }

    case 'saveSetting': {
      db.setting = Object.assign({}, db.setting, payload);
      saveDB(db);
      return { ok:true };
    }

    case 'addKelas': {
      var k = String(payload.kelas||'').trim();
      if(k && db.kelas.indexOf(k) < 0){ db.kelas.push(k); saveDB(db); }
      return { ok:true };
    }

    case 'deleteKelas': {
      var kk = payload.kelas;
      db.kelas = db.kelas.filter(function(x){ return x !== kk; });
      saveDB(db);
      return { ok:true };
    }

    case 'importKelas': {
      var rows = payload.rows || [];
      var added = 0;
      rows.forEach(function(r){
        var n = String(r.Nama || r.kelas || '').trim();
        if(n && db.kelas.indexOf(n) < 0){ db.kelas.push(n); added++; }
      });
      saveDB(db);
      return { msg: added + ' kelas berhasil ditambahkan' };
    }

    case 'saveGuruBK': {
      if(!db.gurubk) db.gurubk = [];
      var p = payload;
      var idx2 = -1;
      if(p.ID){
        for(var i=0;i<db.gurubk.length;i++){
          if(String(db.gurubk[i].ID) === String(p.ID)){ idx2 = i; break; }
        }
      }
      var rec = {
        ID: p.ID || uid(),
        Nama: p.Nama, NIP: p.NIP || '', KelasAmpu: p.KelasAmpu || '',
        Username: p.Username, Password: p.Password,
        TtdBK: p.TtdBK || (idx2 >= 0 ? db.gurubk[idx2].TtdBK : '')
      };
      if(idx2 >= 0) db.gurubk[idx2] = rec;
      else db.gurubk.push(rec);
      saveDB(db);
      return { ok:true };
    }

    case 'deleteGuruBK': {
      db.gurubk = db.gurubk.filter(function(g){ return String(g.ID) !== String(payload.id); });
      saveDB(db);
      return { ok:true };
    }

    case 'saveSiswa': {
      var s = payload;
      var old = s._old;
      var idx3 = -1;
      for(var i=0;i<db.siswa.length;i++){
        if(String(db.siswa[i].NIS) === String(old || s.NIS)){ idx3 = i; break; }
      }
      var rec2 = { NIS:s.NIS, Nama:s.Nama, Kelas:s.Kelas, JK:s.JK||'', NoHP:s.NoHP||'' };
      if(idx3 >= 0) db.siswa[idx3] = rec2;
      else db.siswa.push(rec2);
      saveDB(db);
      return { ok:true };
    }

    case 'deleteSiswa': {
      db.siswa = db.siswa.filter(function(s){ return String(s.NIS) !== String(payload.nis); });
      saveDB(db);
      return { ok:true };
    }

    case 'importSiswa': {
      var rows = payload.rows || [];
      var added = 0, updated = 0;
      rows.forEach(function(r){
        var idx4 = -1;
        for(var i=0;i<db.siswa.length;i++){
          if(String(db.siswa[i].NIS) === String(r.NIS)){ idx4 = i; break; }
        }
        if(idx4 >= 0){ db.siswa[idx4] = Object.assign({}, db.siswa[idx4], r); updated++; }
        else { db.siswa.push({ NIS:r.NIS, Nama:r.Nama, Kelas:r.Kelas||'', JK:r.JK||'', NoHP:r.NoHP||'' }); added++; }
      });
      saveDB(db);
      return { msg: added+' siswa baru ditambahkan, '+updated+' diperbarui' };
    }

    case 'uploadKop':
    case 'uploadTtd':
      return payload.dataUrl;

    case 'refreshMyGuru': {
      var sess2 = getSession();
      if(!sess2 || !sess2.guru) throw new Error('Bukan Guru BK');
      for(var i=0;i<db.gurubk.length;i++){
        if(String(db.gurubk[i].ID) === String(sess2.guru.ID)) return db.gurubk[i];
      }
      throw new Error('Data Guru BK tidak ditemukan');
    }

    case 'importAbsenBulanan': {
      var sheet2 = SH.HADIR;
      if(!db.records[sheet2]) db.records[sheet2] = [];
      var kelas = String(payload.kelas||'');
      var bulan = String(payload.bulan||'');
      if(!kelas || !bulan) throw new Error('Kelas dan bulan wajib diisi');
      var deleted = 0;
      db.records[sheet2] = db.records[sheet2].filter(function(r){
        if(String(r.Kelas) === kelas && String(r.Tanggal||'').slice(0,7) === bulan){ deleted++; return false; }
        return true;
      });
      var inserted = 0;
      var petugas = payload.petugas || 'Admin';
      (payload.rows || []).forEach(function(row){
        var statuses = row.statuses || {};
        Object.keys(statuses).forEach(function(day){
          var d = pad2(parseInt(day,10));
          var tgl = bulan + '-' + d;
          db.records[sheet2].push({
            ID: uid(), Tanggal: tgl, NIS: row.NIS, Nama: row.Nama, Kelas: kelas,
            Status: statuses[day], Keterangan: '', Petugas: petugas
          });
          inserted++;
        });
      });
      saveDB(db);
      return { inserted: inserted, deleted: deleted };
    }

    case 'saveKehadiranBulk': {
      var sheet3 = SH.HADIR;
      if(!db.records[sheet3]) db.records[sheet3] = [];
      if(payload.replaceDate && payload.replaceKelas){
        db.records[sheet3] = db.records[sheet3].filter(function(r){
          return !(String(r.Tanggal) === String(payload.replaceDate) && String(r.Kelas) === String(payload.replaceKelas));
        });
      }
      (payload.rows || []).forEach(function(r){
        db.records[sheet3].push(Object.assign({ ID: uid() }, r));
      });
      saveDB(db);
      return { ok:true };
    }

    case 'importLayanan': {
      var sheet4 = payload.sheet;
      var records = payload.records || [];
      if(!db.records[sheet4]) db.records[sheet4] = [];
      records.forEach(function(r){
        if(!r.ID) r.ID = uid();
        db.records[sheet4].push(r);
      });
      saveDB(db);
      return { msg: records.length + ' data berhasil diimport' };
    }

    case 'exportAll': {
      return JSON.stringify(db);
    }
    case 'importAll': {
      var json = payload.json;
      var parsed = JSON.parse(json);
      if(!parsed || typeof parsed !== 'object') throw new Error('File backup tidak valid');
      if(!parsed.records) throw new Error('Struktur backup tidak dikenali');
      saveDB(parsed);
      return { ok:true };
    }
    case 'resetAll': {
      saveDB(defaultDB());
      return { ok:true };
    }
  }
  throw new Error('Aksi tidak dikenali: ' + action);
}

function api(action, payload){
  payload = Object.assign({}, payload || {});
  if(ST.user && ST.user.role === 'gurubk' && ST.guru && ST.guru.ID){
    payload.guruId = ST.guru.ID;
  }
  return new Promise(function(resolve, reject){
    setTimeout(function(){
      try{
        var data = localApi(action, payload);
        resolve(data);
      }catch(e){
        reject(e);
      }
    }, 20);
  });
}

var _xlsxLoading = null;
function ensureXLSXLoaded(){
  if(typeof XLSX !== 'undefined') return Promise.resolve(XLSX);
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise(function(resolve, reject){
    var s = document.createElement('script');

    s.onload = function(){ if(typeof XLSX !== 'undefined') resolve(XLSX); else reject(new Error('Excel lib gagal')); };
    s.onerror = function(){ reject(new Error('Gagal memuat library Excel')); };
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function parseDate(s){
  if(s instanceof Date) return s;
  var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  return new Date(s);
}
function tgl(d){
  if(!d) return '';
  var dt = parseDate(d);
  if(isNaN(dt)) return String(d);
  return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
function tglPanjang(s){
  if(!s) return '';
  var d = parseDate(s);
  if(isNaN(d)) return s;
  return d.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowTime(){
  var d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function monthName(m){
  var n = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return n[m-1] || '';
}
function pad2(n){ return String(n).padStart(2,'0'); }
function normalizeDate(v){
  if(v === null || v === undefined || v === '') return '';
  var s = String(v).trim();
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
  if(m){
    var y = m[3].length === 2 ? ('20'+m[3]) : m[3];
    return y+'-'+pad2(m[2])+'-'+pad2(m[1]);
  }
  var d = new Date(s);
  if(!isNaN(d)) return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  return s;
}
function normalizeTime(v){
  if(v === null || v === undefined || v === '') return '';
  var s = String(v).trim();
  var m = s.match(/^(\d{1,2}):(\d{2})/);
  if(m) return pad2(m[1])+':'+m[2];
  if(/^\d+(\.\d+)?$/.test(s)){
    var num = parseFloat(s);
    if(num >= 0 && num < 1){
      var totalMin = Math.round(num * 24 * 60);
      var h = Math.floor(totalMin/60), mi = totalMin%60;
      return pad2(h)+':'+pad2(mi);
    }
    if(num >= 0 && num <= 23){ return pad2(Math.floor(num))+':00'; }
  }
  return s;
}
function toast(msg, type){
  var d = document.createElement('div');
  d.className = 'tst ' + (type==='er'?'er':type==='inf'?'inf':'ok');
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(function(){
    d.style.opacity='0'; d.style.transition='.3s';
    setTimeout(function(){ d.remove(); },300);
  }, 3200);
}
function normPhone(n){
  if(!n) return '';
  var s = String(n).replace(/[^\d+]/g,'');
  s = s.replace(/^\+/,'');
  if(s.indexOf('0') === 0) return '62' + s.substring(1);
  if(s.indexOf('62') === 0) return s;
  if(s.indexOf('8') === 0) return '62' + s;
  return s;
}
function waLink(nama, nomor, pesan){
  var n = normPhone(nomor);
  if(!n) return '';
  var msg = encodeURIComponent(pesan || ('Assalamualaikum ' + (nama||'') + ', '));
  return 'https://wa.me/' + n + '?text=' + msg;
}

var _hadirLoading = null;
function getHadirRows(forceRefresh){
  if(forceRefresh){ ST.cache[SH.HADIR] = null; _hadirLoading = null; }

/* =========================================================
   TIER & PENANGANAN
   ========================================================= */
function penangananSering(jenis, n){
  if(jenis === 'izin' || jenis === 'terlambat'){
    if(n >= 10) return 'Tier 4 | Kunjungan rumah + surat peringatan tertulis + koordinasi Wali Kelas & Kepala Sekolah untuk tindakan disiplin';
    if(n >= 7)  return 'Tier 3 | Wali Kelas memfasilitasi pemanggilan orang tua + konseling intensif Guru BK + surat peringatan tertulis';
    if(n >= 5)  return 'Tier 2 | Wali Kelas berkoordinasi dengan Guru BK + konseling individual + pemanggilan orang tua ke sekolah';
    if(n >= 3)  return 'Tier 1 | Wali Kelas memberi teguran lisan dan pembinaan; Guru BK memantau perkembangan';
    return 'Pemantauan rutin Wali Kelas';
  }
  return '-';
}
function penangananRawan(A, total){
  if(A >= 10) return 'Tier 4 | Kunjungan rumah + surat peringatan tertulis + koordinasi Wali Kelas & Kepala Sekolah';
  if(A >= 5)  return 'Tier 3 | Wali Kelas memfasilitasi pemanggilan orang tua + konseling intensif Guru BK + home visit';
  if(A >= 3)  return 'Tier 2 | Wali Kelas berkoordinasi dengan Guru BK + konseling individual + home visit awal';
  if(total >= 5) return 'Tier 1 | Wali Kelas melakukan pembinaan; Guru BK memantau perkembangan';
  return 'Pemantauan rutin Wali Kelas';
}
function tierBadge(txt, range){
  var m = String(txt||'').match(/^Tier\s*(\d)/i);
  if(!m) return '<span class="reko">'+esc(txt)+'</span>';
  var t = m[1];
  var rangeHTML = range ? ' <span class="tier-range">'+esc(range)+'</span>' : '';
  return '<span class="tier tier-'+t+'">Tier '+t+rangeHTML+'</span> <span class="reko">'+esc(txt.replace(/^Tier\s*\d\s*\|\s*/i,''))+'</span>';
}
function tierNumFromPenanganan(txt){
  var m = String(txt||'').match(/^Tier\s*(\d)/i);
  return m ? +m[1] : 1;
}
function rawanRowClass(tier){
  var t = Math.max(1, Math.min(4, +tier || 1));
  return 'rawan-t' + t;
}
function tierRangeInfo(jenis, tier){
  var t = +tier;
  if(jenis === 'izin' || jenis === 'terlambat'){
    if(t === 1) return '(3–4×)';
    if(t === 2) return '(5–6×)';
    if(t === 3) return '(7–9×)';
    if(t === 4) return '(≥10×)';
  } else if(jenis === 'kehadiran' || jenis === 'rawan'){
    if(t === 1) return '(total ≥5)';
    if(t === 2) return '(Alpa 3–4)';
    if(t === 3) return '(Alpa 5–9)';
    if(t === 4) return '(Alpa ≥10)';
  }
  return '';
}
function sortByRawanSering(list, jenis){
  return list.slice().sort(function(a, b){
    var ta = tierNumFromPenanganan(penangananSering(jenis, a.n));
    var tb = tierNumFromPenanganan(penangananSering(jenis, b.n));
    if(tb !== ta) return tb - ta;
    if(b.n !== a.n) return b.n - a.n;
    return String(a.Nama||'').localeCompare(String(b.Nama||''));
  });
}
function sortByRawanKehadiran(list){
  return list.slice().sort(function(a, b){
    var totalA = (a.t != null ? a.t : a.total);
    var totalB = (b.t != null ? b.t : b.total);
    var ta = tierNumFromPenanganan(penangananRawan(a.A, totalA));
    var tb = tierNumFromPenanganan(penangananRawan(b.A, totalB));
    if(tb !== ta) return tb - ta;
    if(b.A !== a.A) return b.A - a.A;
    if(totalB !== totalA) return totalB - totalA;
    return String(a.Nama||'').localeCompare(String(b.Nama||''));
  });
}
function filterRawanByJenis(list, jenis){
  if(!jenis) return list;
  return list.filter(function(x){
    if(jenis === 'S') return (x.S||0) > 0;
    if(jenis === 'I') return (x.I||0) > 0;
    if(jenis === 'A') return (x.A||0) > 0;
    return true;
  });
}
function sortRawanByJenis(list, jenis){
  if(!jenis) return sortByRawanKehadiran(list);
  return list.slice().sort(function(a, b){
    var va = (jenis === 'S') ? (a.S||0) : (jenis === 'I') ? (a.I||0) : (a.A||0);
    var vb = (jenis === 'S') ? (b.S||0) : (jenis === 'I') ? (b.I||0) : (b.A||0);
    if(vb !== va) return vb - va;
    var totalA = (a.t != null ? a.t : a.total) || 0;
    var totalB = (b.t != null ? b.t : b.total) || 0;
    if(totalB !== totalA) return totalB - totalA;
    return String(a.Nama||'').localeCompare(String(b.Nama||''));
  });
}
function jenisLabelOf(jenis){
  if(jenis === 'S') return 'Sakit';
  if(jenis === 'I') return 'Izin';
  if(jenis === 'A') return 'Alpa';
  return 'Semua Ketidakhadiran';
}

document.addEventListener('DOMContentLoaded', function(){

function doLogin(){
  var u = $('#lgUser').value.trim();
  var p = $('#lgPass').value;
  var e = $('#loginErr');
  e.style.display='none';
  if(!u || !p){ e.textContent='Username dan password wajib diisi.'; e.style.display='block'; return; }
  e.textContent = 'Memproses…'; e.style.display='block';
  api('login',{username:u,password:p}).then(function(d){
    ST.token = d.token;
    ST.user  = d;
    if(d.role === 'gurubk'){
      ST.guru = d.guru || null;
      if(!ST.guru){
        e.textContent = 'Data Guru BK tidak ditemukan. Hubungi Administrator.';
        e.style.display='block';
        return;
      }
    }
    e.style.display='none';
    startApp();
  }).catch(function(err){
    e.textContent = 'Error: ' + (err && err.message ? err.message : err);
    e.style.display='block';
  });
}
function logout(){
  ST.token=null; ST.user=null; ST.guru=null; ST.cache={}; _hadirLoading=null;
  ST.khTab='daftar'; ST.tlTab='daftar'; ST.izTab='daftar'; ST.history=[];
  setSession(null);
  $('#app').style.display='none';
  $('#login').style.display='flex';
  $('#lgPass').value='';
  updateBackButton();
}
function startApp(){
  $('#login').style.display='none';
  $('#app').style.display='block';
  var who = ST.user.role==='admin' ? 'Administrator'
          : ST.user.role==='guru'  ? 'Guru'
          : 'Guru BK' + (ST.guru ? ' — '+ST.guru.Nama : '');
  $('#whoTxt').textContent = who;
  ST.history = [];
  loadMaster().then(function(){
    buildMenu();
    go('dashboard');
  }).catch(function(e){
    toast('Gagal memuat data awal: '+e.message,'er');
  });
}
function loadMaster(){
  return api('bootstrap').then(function(b){
    ST.kelas  = b.kelas  || [];
    ST.gurubk = b.gurubk || [];
    ST.setting= b.setting|| {};
    ST.siswa  = b.siswa  || [];
    if(b.guru) ST.guru = b.guru;
  });
}
function kelasSaya(){
  if(ST.user && ST.user.role === 'gurubk'){
    if(ST.guru && ST.guru.KelasAmpu){
      var arr = String(ST.guru.KelasAmpu).split(',').map(function(s){return s.trim();}).filter(Boolean);
      if(arr.length) return arr;
    }
    return [];
  }
  return ST.kelas;
}
function siswaSaya(){
  var ks = kelasSaya();
  if(!ks.length) return [];
  return ST.siswa.filter(function(s){ return ks.indexOf(s.Kelas) >= 0; });
}
function refreshMyGuru(){
  if(!ST.user || ST.user.role !== 'gurubk') return;
  toast('Memuat ulang data Guru BK…','inf');
  api('refreshMyGuru').then(function(g){ ST.guru = g; return loadMaster(); })
    .then(function(){ toast('Data Guru BK diperbarui'); go('dashboard'); })
    .catch(function(e){ toast(e.message,'er'); });
}

function buildMenu(){
  var role = ST.user.role;
  var html='', lastSec='';
  MENU.forEach(function(m){
    if(m.roles && m.roles.indexOf(role)<0) return;
    if(m.sec !== lastSec){ html += '<div class="sec">'+m.sec+'</div>'; lastSec=m.sec; }
    html += '<a href="#" data-p="'+m.id+'" onclick="go(\''+m.id+'\');return false;"><i>'+m.i+'</i>'+m.l+'</a>';
  });
  $('#side').innerHTML = html;
}
function updateBackButton(){
  var b = $('#btnBack');
  if(!b) return;
  var has = ST.history && ST.history.length > 0;
  b.disabled = !has;
  b.title = has ? ('Kembali ke: ' + getMenuLabel(ST.history[ST.history.length-1])) : 'Tidak ada riwayat';
}
function getMenuLabel(pageId){
  for(var i=0;i<MENU.length;i++){ if(MENU[i].id === pageId) return MENU[i].l; }
  return pageId;
}
function goBack(){
  if(!ST.history.length) return;
  var prev = ST.history.pop();
  go(prev, true);
}
function go(page, skipHistory){
  var menu = null;
  for(var i=0;i<MENU.length;i++){ if(MENU[i].id===page){ menu = MENU[i]; break; } }
  if(menu && menu.roles && menu.roles.indexOf(ST.user.role)<0){
    toast('Anda tidak memiliki akses ke menu ini','er');
    return;
  }
  if(!skipHistory && ST.page && ST.page !== page){
    ST.history.push(ST.page);
    if(ST.history.length > 30) ST.history.shift();
  }
  ST.page = page;
  $$('#side a').forEach(function(a){ a.classList.toggle('on', a.dataset.p===page); });
  $('#side').classList.remove('open');
  var R = {
    dashboard:renderDashboard, setting:renderSetting, backup:renderBackup,
    izin:function(){ renderLayanan('izin'); },
    terlambat:function(){ renderLayanan('terlambat'); },
    siswa:renderSiswa, kehadiran:renderKehadiran,
    klasikal:function(){ renderKegiatan('klasikal'); },
    kelompok:function(){ renderKegiatan('kelompok'); },
    kr:function(){ renderKegiatan('kr'); },
    konseling:function(){ renderKegiatan('konseling'); },
    panggilan:function(){ renderKegiatan('panggilan'); },
    anekdot:function(){ renderKegiatan('anekdot'); },
    kasus:function(){ renderKegiatan('kasus'); },
    lain:function(){ renderKegiatan('lain'); },
    rekapitulasi:renderRekapitulasi,
    report:renderReport
  };
  (R[page] || renderDashboard)();
  updateBackButton();
}

function buildForm(key, data){
  var defs = FORMS[key];
  var d = data || {};
  var html = '<div class="row r2">';
  defs.forEach(function(f){
    var val = (d[f.k] !== undefined && d[f.k] !== '') ? d[f.k] : (typeof f.def === 'function' ? f.def() : (f.def||''));
    var full = f.full ? ' style="grid-column:1/-1"' : '';
    var req = f.req ? ' <span style="color:#e74c3c">*</span>' : '';
    var inp = '';
    if(f.t === 'textarea'){
      inp = '<textarea id="f_'+f.k+'" '+(f.req?'data-req="1"':'')+' rows="3">'+esc(val)+'</textarea>';
    } else if(f.t === 'select'){
      var opts = (f.opts||[]).slice();
      if(val && opts.indexOf(val) < 0) opts.unshift(val);
      inp = '<select id="f_'+f.k+'" '+(f.req?'data-req="1"':'')+'>'+
        opts.map(function(o){ return '<option '+(o===val?'selected':'')+'>'+esc(o)+'</option>'; }).join('')+
        '</select>';
    } else if(f.t === 'kelas'){
      inp = '<select id="f_'+f.k+'" data-req="1" onchange="onKelasChange(this.value)">'+
        '<option value="">-- Pilih Kelas --</option>'+
        kelasSaya().map(function(k){ return '<option '+(k===val?'selected':'')+'>'+esc(k)+'</option>'; }).join('')+
        '</select>';
    } else if(f.t === 'siswa'){
      inp = '<select id="f_'+f.k+'" data-req="1"><option value="">-- Pilih Siswa --</option></select>';
    } else if(f.t === 'multisiswa'){
      var currentNis = String(val||'').split(';').map(function(s){ return s.trim().split(' - ')[0].trim(); }).filter(Boolean);
      var listSiswa = (ST.siswa||[]).slice().sort(function(a,b){ return a.Nama.localeCompare(b.Nama); });
      inp = '<div class="mslist" id="mslist_'+f.k+'">'+
        '<input type="text" id="mssearch_'+f.k+'" placeholder="Cari nama / NIS…" style="margin-bottom:8px;padding:6px 10px;font-size:12px" oninput="filterMultiSiswa(\''+f.k+'\')">'+
        '<div>'+
        listSiswa.map(function(s){
          var checked = currentNis.indexOf(String(s.NIS)) >= 0 ? 'checked' : '';
          return '<label class="ms-item" data-search="'+esc((s.Nama+' '+s.NIS).toLowerCase())+'">'+
            '<input type="checkbox" class="msCheck_'+f.k+'" value="'+esc(s.NIS)+'" data-nama="'+esc(s.Nama)+'" '+checked+' onchange="updateMultiSiswa(\''+f.k+'\')"> '+
            esc(s.Nama)+' <span class="small">('+esc(s.Kelas)+')</span></label>';
        }).join('')+
        '</div></div>'+
        '<input type="hidden" id="f_'+f.k+'" value="'+esc(val||'')+'">'+
        '<div class="hint" id="msinfo_'+f.k+'">Terpilih: <b>'+currentNis.length+'</b> siswa</div>';
    } else if(f.t === 'sig'){

function compressCanvas(cv, maxW, quality){
  try{
    var scale = Math.min(1, maxW / cv.width);
    var tmp = document.createElement('canvas');
    tmp.width = Math.round(cv.width * scale);
    tmp.height = Math.round(cv.height * scale);
    var ctx = tmp.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,tmp.width,tmp.height);
    ctx.drawImage(cv, 0, 0, tmp.width, tmp.height);
    return tmp.toDataURL('image/jpeg', quality);
  }catch(e){
    return cv.toDataURL('image/png');
  }
}

function collectForm(key){
  var defs = FORMS[key];
  var out = {};
  var ok = true, firstBad = null;
  defs.forEach(function(f){
    if(f.t === 'sig'){
      var c = document.getElementById('sig_'+f.k);
      var h = document.getElementById('f_'+f.k);
      var v = h ? h.value : '';
      if(c && c.dataset.drawn === '1') v = compressCanvas(c, 420, 0.75);
      out[f.k] = v || '';
      return;
    }
    var el = document.getElementById('f_'+f.k);
    if(!el) return;
    var val = el.value.trim();
    if(f.req && !val){ ok = false; if(!firstBad) firstBad = f.l; }
    out[f.k] = val;
  });
  if(!ok){ toast('Kolom wajib belum lengkap: ' + firstBad, 'er'); return null; }
  if(out.NIS && String(out.NIS).indexOf(' - ') < 0){
    var s = ST.siswa.find(function(x){ return String(x.NIS) === String(out.NIS); });
    if(s){ out.Nama = s.Nama; if(!out.Kelas) out.Kelas = s.Kelas; }
  }
  return out;
}
function initSigPads(){
  $$('canvas[data-sig]').forEach(function(cv){
    var rect = cv.getBoundingClientRect();
    cv.width  = Math.max(rect.width || 400, 300);
    cv.height = 130;
    var ctx = cv.getContext('2d');
    ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.strokeStyle='#12324a';
    var drawing = false;
    function pos(e){
      var r = cv.getBoundingClientRect();
      var t = e.touches ? e.touches[0] : e;
      return { x:(t.clientX - r.left) * (cv.width/r.width),
               y:(t.clientY - r.top ) * (cv.height/r.height) };
    }
    function down(e){ e.preventDefault(); drawing = true; cv.dataset.drawn='1'; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
    function move(e){ if(!drawing) return; e.preventDefault(); var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
    function up(){ drawing = false; }
    cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move);
    window.addEventListener('mouseup',up);
    cv.addEventListener('touchstart',down,{passive:false});
    cv.addEventListener('touchmove',move,{passive:false});
    cv.addEventListener('touchend',up);
  });
}
function clearSig(id){
  var cv = document.getElementById(id);
  if(!cv) return;
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
  cv.dataset.drawn = '0';
  var h = document.getElementById('f_'+id.replace('sig_',''));
  if(h) h.value = '';
}

function fileToDataURL(file){
  return new Promise(function(res,rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result); };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function resizeImage(dataUrl, maxW, quality){
  return new Promise(function(resolve){
    try{
      var img = new Image();
      img.onload = function(){
        try{
          var scale = Math.min(1, maxW / img.width);
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0,0,c.width,c.height);
          ctx.drawImage(img,0,0,c.width,c.height);
          resolve(c.toDataURL('image/jpeg', quality || 0.85));
        }catch(e){ resolve(dataUrl); }
      };
      img.onerror = function(){ resolve(dataUrl); };
      img.src = dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}

function prosesImportKelas(){
  var f = $('#impKelasFile').files[0];
  var kirim = function(rows){
    if(!rows.length) return toast('Tidak ada data valid','er');
    api('importKelas',{rows:rows}).then(function(r){
      return loadMaster().then(function(){
        closeModal();
        toast(r.msg || (rows.length+' kelas berhasil ditambahkan'));
        renderSetting();
      });
    }).catch(function(e){ toast(e.message,'er'); });
  };
  var parseText = function(txt){
    var lines = String(txt||'').split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
    if(!lines.length) return toast('Tidak ada data','er');
    var start = 0;
    if(/kelas|nama/i.test(lines[0]) && lines[0].length < 20) start = 1;
    var rows = [];
    for(var i=start;i<lines.length;i++){
      var c = lines[i].split(/[,;\t]/)[0].trim().replace(/^"|"$/g,'');
      if(c) rows.push({Nama:c});
    }
    kirim(rows);
  };
  if(f){
    var name = (f.name||'').toLowerCase();
    if(name.endsWith('.xlsx') || name.endsWith('.xls')){
      toast('Membaca file…','inf');
      bacaFileMentah(f).then(function(arr){
        if(!arr.length) return toast('File kosong','er');
        var start = 0;
        var first = String((arr[0]||[])[0]||'').toLowerCase();
        if(first.indexOf('kelas')>=0 || first.indexOf('nama')>=0) start = 1;
        var rows = [];
        for(var i=start;i<arr.length;i++){
          var v = String((arr[i]||[])[0]||'').trim();
          if(v) rows.push({Nama:v});
        }
        kirim(rows);
      }).catch(function(err){ toast('Gagal baca file: '+err.message,'er'); });
    } else {
      var rr = new FileReader();
      rr.onload = function(){ parseText(rr.result); };
      rr.readAsText(f, 'UTF-8');
    }
  } else {
    var t = $('#impKelasText').value;
    if(!t.trim()) return toast('Pilih file atau tempel data','er');
    parseText(t);
  }
}

function downloadBackupFile(){
  try{
    var raw = localStorage.getItem(DB_KEY) || '{}';
    var fname = 'bk_backup_' + today() + '_' + nowTime().replace(':','') + '.json';
    var blob = new Blob([raw], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    var db = loadDB(); db.lastBackup = today(); saveDB(db);
    toast('Backup berhasil diunduh');
    renderBackup();
  }catch(e){ toast('Gagal backup: '+e.message,'er'); }

/* =========================================================
   GOOGLE DRIVE
   ========================================================= */
var gdriveToken = null;
var gdriveExpires = 0;

function ensureGdriveAuth(){
  if(location.protocol === 'file:'){
    return Promise.reject(new Error(
      'Google OAuth tidak dapat berjalan saat file dibuka langsung (file://).\n\n' +
      'Solusi:\n' +
      '• Host aplikasi ini di HTTPS (mis. GitHub Pages, Netlify, Vercel), ATAU\n' +
      '• Jalankan server lokal: buka terminal di folder file ini, jalankan "python -m http.server 8000", lalu buka http://localhost:8000/index.html\n\n' +
      'Sementara itu, gunakan tombol "Unduh Backup (.json)" untuk backup lokal.'
    ));
  }
  var cid = String((ST.setting && ST.setting.driveClientId) || '').trim();
  if(!cid) return Promise.reject(new Error('Google OAuth Client ID belum diisi. Isi di kolom Client ID di bawah.'));
  if(cid.indexOf('.apps.googleusercontent.com') < 0){
    return Promise.reject(new Error('Format Client ID tidak valid. Harus berakhiran .apps.googleusercontent.com'));
  }
  if(gdriveToken && Date.now() < gdriveExpires - 60000) return Promise.resolve(gdriveToken);
  return new Promise(function(resolve, reject){
    if(!window.google || !google.accounts || !google.accounts.oauth2){
      reject(new Error('Google API belum termuat. Tunggu 2–3 detik lalu coba lagi.'));
      return;
    }
    var tc;
    try{
      tc = google.accounts.oauth2.initTokenClient({
        client_id: cid,
        scope: GDRIVE_SCOPE,
        callback: function(resp){
          if(resp.error){
            var msg = resp.error_description || resp.error || 'Unknown OAuth error';
            var low = String(msg).toLowerCase();
            if(low.indexOf('access blocked') >= 0 || low.indexOf('origin') >= 0 || low.indexOf('origin_mismatch') >= 0 || resp.error === 'access_denied'){
              msg =
                'Access blocked / Origin tidak cocok.\n\n' +
                'Periksa 4 hal berikut di Google Cloud Console:\n' +
                '1. APIs & Services → Credentials → OAuth 2.0 Client ID (Web application).\n' +
                '2. Di bagian "Authorized JavaScript origins" tambahkan: ' + location.origin + '\n' +
                '3. Di bagian "Authorized redirect URIs" tambahkan: ' + location.origin + '\n' +
                '4. OAuth consent screen → jika status masih "Testing", tambahkan email Google Anda di daftar "Test users" (atau klik "Publish app").\n' +
                '5. Pastikan Google Drive API sudah diaktifkan di project (APIs & Services → Library → Google Drive API → Enable).';
            } else if(low.indexOf('invalid_client') >= 0){
              msg = 'Client ID tidak dikenali. Pastikan Client ID dibuat untuk tipe "Web application", bukan Android/iOS/Desktop.';
            } else if(low.indexOf('idpiframe_initialization_failed') >= 0){
              msg = 'Cookie pihak ketiga diblokir browser. Nonaktifkan pemblokir cookie untuk domain ini, atau buka di mode Incognito.';
            }
            reject(new Error(msg));
            return;
          }
          gdriveToken = resp.access_token;
          gdriveExpires = Date.now() + ((resp.expires_in || 3600) * 1000);
          resolve(gdriveToken);
        },
        error_callback: function(err){
          var t = (err && (err.type || err.message)) || 'unknown';
          reject(new Error('OAuth gagal: ' + t));
        }
      });
    }catch(e){
      reject(new Error('Gagal inisialisasi OAuth: ' + e.message));
      return;
    }
    try{
      tc.requestAccessToken({ prompt: 'consent' });
    }catch(e){
      reject(new Error('Gagal membuka dialog Google: ' + e.message));
    }
  });
}
function driveStatus(txt, type){
  var el = $('#driveStatus');
  if(!el) return;
  el.innerHTML = txt;
  el.style.color = (type === 'er') ? '#c0392b' : (type === 'ok') ? '#1e8449' : '#1a73e8';
}
function driveUploadBackup(){
  driveStatus('🔄 Menghubungkan ke Google Drive…');
  ensureGdriveAuth().then(function(token){
    driveStatus('🔄 Mengunggah backup…');
    var raw = localStorage.getItem(DB_KEY) || '{}';
    var fname = 'bk_backup_' + today() + '_' + nowTime().replace(':','') + '.json';
    var boundary = '-------bk' + Date.now();
    var metadata = { name: fname, mimeType: 'application/json' };
    var body =
      '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      raw + '\r\n' +
      '--' + boundary + '--';
    return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'multipart/related; boundary="' + boundary + '"'
      },
      body: body
    }).then(function(r){
      return r.text().then(function(t){
        if(!r.ok) throw new Error('Upload gagal ('+r.status+'): '+t);
        return JSON.parse(t);
      });
    });
  }).then(function(file){
    var db = loadDB(); db.lastBackup = today(); saveDB(db);
    driveStatus('✅ Backup berhasil diunggah ke Google Drive: <b>'+esc(file.name)+'</b>', 'ok');
    toast('Backup Google Drive berhasil');
    setTimeout(function(){ driveStatus('✅ Backup berhasil: '+esc(file.name), 'ok'); }, 30);
  }).catch(function(e){
    var pesan = String(e.message||'').replace(/\n/g,'<br>');
    driveStatus('❌ '+pesan, 'er');
    toast('Gagal backup: cek petunjuk merah di bawah tombol','er');
  });
}
function driveShowRestore(){
  driveStatus('🔄 Mengambil daftar backup…');
  ensureGdriveAuth().then(function(token){
    var q = encodeURIComponent("name contains 'bk_backup_' and trashed=false and mimeType='application/json'");
    return fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&orderBy=createdTime desc&pageSize=30&fields=files(id,name,createdTime,size)', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error('Gagal akses Drive: '+t); });
      return r.json();
    }).then(function(d){ return d.files || []; });
  }).then(function(files){
    if(!files.length){
      driveStatus('Belum ada file backup di Google Drive.', 'er');
      return;
    }
    var rows = files.map(function(f){
      var sz = f.size ? (f.size/1024).toFixed(1)+' KB' : '-';
      var tglStr = f.createdTime ? new Date(f.createdTime).toLocaleString('id-ID') : '-';
      return '<tr><td><b>'+esc(f.name)+'</b></td><td>'+esc(tglStr)+'</td><td>'+sz+'</td>'+
        '<td class="right"><button class="btn5 btn-sm" onclick="driveRestoreFile(\''+f.id+'\',\''+esc(f.name)+'\')">Restore</button> '+
        '<button class="btn3 btn-sm" onclick="driveDeleteFile(\''+f.id+'\')">Hapus</button></td></tr>';
    }).join('');
    openModal('📂 Pilih Backup dari Google Drive',
      '<div class="tw"><table><thead><tr><th>Nama File</th><th>Dibuat</th><th>Ukuran</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="notif edit" style="margin-top:12px">⚠️ File terbaru direkomendasikan. Restore akan menimpa seluruh data saat ini.</div>',
      '<button class="btn2" onclick="closeModal()">Tutup</button>', true);
    driveStatus('✅ Terhubung ke Google Drive', 'ok');
  }).catch(function(e){
    var pesan = String(e.message||'').replace(/\n/g,'<br>');
    driveStatus('❌ '+pesan, 'er');
    toast('Gagal akses Drive: cek pesan merah di bawah tombol','er');
  });
}
function driveRestoreFile(fileId, fileName){
  if(!confirm('Restore data dari "'+fileName+'"?\nSemua data saat ini akan diganti.')) return;
  confirmBox('Konfirmasi terakhir: data lokal akan ditimpa dengan backup Google Drive.', function(){
    driveStatus('🔄 Mengunduh file backup…');
    ensureGdriveAuth().then(function(token){
      return fetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function(r){
        if(!r.ok) throw new Error('Gagal unduh backup');
        return r.text();
      });
    }).then(function(txt){
      var parsed = JSON.parse(txt);
      if(!parsed || !parsed.records) throw new Error('File backup tidak valid');
      saveDB(parsed);
      closeModal();
      toast('Restore berhasil. Memuat ulang…');
      setTimeout(function(){ location.reload(); }, 800);
    }).catch(function(e){
      var pesan = String(e.message||'').replace(/\n/g,'<br>');
      driveStatus('❌ '+pesan, 'er');
      toast('Gagal restore','er');
    });
  });
}
function driveDeleteFile(fileId){
  if(!confirm('Hapus file backup ini dari Google Drive?')) return;
  ensureGdriveAuth().then(function(token){
    return fetch('https://www.googleapis.com/drive/v3/files/'+fileId, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(function(r){
      if(!r.ok && r.status !== 204) throw new Error('Gagal hapus file');
    });
  }).then(function(){
    toast('File backup dihapus');
    driveShowRestore();
  }).catch(function(e){ toast(e.message,'er'); });
}

function renderLayanan(key){
  var isIzin = (key === 'izin');

  var activeTab = isIzin ? (ST.izTab||'daftar') : (ST.tlTab||'daftar');
  var tabs = [
    {id:'daftar',   label: (isIzin?'📋 Daftar Perizinan':'📋 Daftar Keterlambatan')},
    {id:'rekap',    label: '📊 Rekap Perbulan Perkelas'},
    {id:'rawan',    label: '⚠️ Siswa Rawan'}
  ];
  var cbFn = isIzin ? 'izTabGo' : 'tlTabGo';
  var judul = isIzin ? '🚪 Perizinan Keluar Sekolah' : '⏰ Keterlambatan Siswa';
  var sub = isIzin ? 'Pencatatan izin keluar sekolah dan analisis' : 'Pencatatan siswa terlambat dan analisis';
  $('#main').innerHTML =
    '<div class="hd">'+
      '<div><h2>'+judul+'</h2><div class="sub">'+sub+'</div></div>'+
      '<div class="tools">'+
        '<button class="btn" onclick="formLayanan(\''+key+'\')">+ Tambah Data</button>'+

        '<button class="btn4" onclick="exportLayanan(\''+key+'\')">⬇ Export</button>'+
      '</div>'+
    '</div>'+
    tabBar(activeTab, tabs, cbFn) +
    '<div id="layContent"><div class="empty">Memuat…</div></div>';
  loadLayananData(key, activeTab);
}
function izTabGo(t){ ST.izTab = t; renderLayanan('izin'); }
function tlTabGo(t){ ST.tlTab = t; renderLayanan('terlambat'); }

function loadLayananData(key, tab){
  api('getData',{sheet: key==='izin'?SH.IZIN:SH.TERLAMBAT}).then(function(rows){
    ST.cache[key] = rows || [];
    var ks = kelasSaya();
    var filtered = ST.cache[key].filter(function(r){ return ks.indexOf(r.Kelas) >= 0; });
    var el = $('#layContent');
    if(!el) return;
    if(tab === 'daftar'){
      el.innerHTML = renderLayananDaftar(key, filtered);
      var bln = today().slice(0,7);
      var bulanIni = filtered.filter(function(r){ return String(r.Tanggal).slice(0,7) === bln; });
      ST.cache['view_'+key] = bulanIni;
      var tbl = $('#tblLayanan');
      if(tbl) tbl.innerHTML = tabelLayanan(key, bulanIni, key==='izin');
    } else if(tab === 'rekap'){
      el.innerHTML = renderLayananRekap(key, filtered);
      setTimeout(function(){ hitungLayananRekap(key); }, 10);
    } else if(tab === 'rawan'){
      el.innerHTML = renderLayananRawan(key, filtered);
    }
  }).catch(function(e){
    var el = $('#layContent');
    if(el) el.innerHTML = '<div class="card"><div class="empty">'+esc(e.message)+'</div></div>';
  });
}

function renderLayananDaftar(key, rows){
  var isIzin = key === 'izin';
  var ks = kelasSaya();
  var bln = today().slice(0,7);
  var bulanIni = rows.filter(function(r){ return String(r.Tanggal).slice(0,7) === bln; });
  return '<div class="stat">'+
    '<div class="sc"><div class="n">'+rows.length+'</div><div class="l">Total Data</div></div>'+
    '<div class="sc y"><div class="n">'+bulanIni.length+'</div><div class="l">Bulan Ini</div></div>'+
  '</div>'+
  '<div class="card">'+
    '<div class="fbar">'+
      '<div class="fg"><label>Dari Tanggal</label><input type="date" id="fDari" value="'+bln+'-01"></div>'+
      '<div class="fg"><label>Sampai Tanggal</label><input type="date" id="fSampai" value="'+today()+'"></div>'+

function hitungLayananRekap(key){
  var bulanEl = $('#rkBulan'), kelasEl = $('#rkKelas'), vEl = $('#rkView');
  if(!bulanEl || !vEl) return;
  var bulan = bulanEl.value || today().slice(0,7);
  var kelasFilter = kelasEl ? kelasEl.value : '';
  var all = ST.cache[key] || [];
  var ks = kelasSaya();
  var eventsByNis = {};
  all.forEach(function(r){
    if(String(r.Tanggal||'').slice(0,7) !== bulan) return;
    if(ks.indexOf(r.Kelas) < 0) return;
    var nis = String(r.NIS||'');
    if(!nis) return;
    eventsByNis[nis] = (eventsByNis[nis] || 0) + 1;
  });
  var students = (ST.siswa||[]).filter(function(s){
    return ks.indexOf(s.Kelas) >= 0 && (!kelasFilter || s.Kelas === kelasFilter);
  });
  var byClass = {};
  students.forEach(function(s){ byClass[s.Kelas] = byClass[s.Kelas] || []; byClass[s.Kelas].push(s); });
  Object.keys(byClass).forEach(function(k){ byClass[k].sort(function(a,b){ return a.Nama.localeCompare(b.Nama); }); });
  var parts = bulan.split('-');
  var totalEvents = 0;
  Object.keys(eventsByNis).forEach(function(n){ totalEvents += eventsByNis[n]; });
  var siswaWithEvent = Object.keys(eventsByNis).length;
  var html = '<div class="grid-cards" style="margin-bottom:14px">'+
    '<div class="gc"><div class="lbl">Bulan</div><div class="val" style="font-size:16px">'+monthName(+parts[1])+' '+parts[0]+'</div></div>'+
    '<div class="gc"><div class="lbl">Total Kejadian</div><div class="val">'+totalEvents+'</div></div>'+
    '<div class="gc"><div class="lbl">Siswa Terlibat</div><div class="val">'+siswaWithEvent+'</div></div>'+
    '<div class="gc"><div class="lbl">Kelas</div><div class="val">'+Object.keys(byClass).length+'</div></div>'+
  '</div>';
  var jenisLabel = key === 'izin' ? 'Izin' : 'Terlambat';
  Object.keys(byClass).sort().forEach(function(kls){
    var list = byClass[kls];
    var kelasTotal = 0;
    list.forEach(function(s){ kelasTotal += (eventsByNis[String(s.NIS)] || 0); });
    html += '<div class="kelas-group">'+
      '<h3><span>Kelas: '+esc(kls)+'</span><span class="total">'+list.length+' siswa • '+kelasTotal+' '+jenisLabel+'</span></h3>'+
      '<div class="tw"><table><thead><tr>'+
        '<th style="width:44px">No</th><th>NIS</th><th>Nama</th><th style="width:130px;text-align:center">Jumlah '+jenisLabel+'</th><th style="width:60px;text-align:center">Aksi</th>'+
      '</tr></thead><tbody>'+
      list.map(function(s,i){
        var n = eventsByNis[String(s.NIS)] || 0;
        var color = n === 0 ? 'color:#b5c0cc' : n>=3 ? 'color:#c0392b;font-weight:800' : n>=1 ? 'color:#b9770e;font-weight:700' : '';
        var tag = n === 0 ? '<span class="tag tgray">0</span>'
                : n>=3 ? '<span class="tag tr">'+n+'</span>'
                : '<span class="tag ty">'+n+'</span>';
        var wa = '';
        if(s.NoHP){
          wa = '<a class="btn-wa" href="'+esc(waLink(s.Nama, s.NoHP, 'Assalamualaikum ' + s.Nama + ', '))+'" target="_blank">💬</a>';
        }
        return '<tr><td>'+(i+1)+'</td><td style="'+color+'">'+esc(s.NIS)+'</td>'+
          '<td style="'+color+'">'+esc(s.Nama)+'</td>'+
          '<td style="text-align:center">'+tag+'</td>'+
          '<td style="text-align:center">'+wa+'</td></tr>';
      }).join('')+
      '</tbody></table></div>'+
    '</div>';
  });
  if(!Object.keys(byClass).length) html += '<div class="empty">Tidak ada siswa di kelas ampu Anda.</div>';
  vEl.innerHTML = html;
  ST.cache.lpRekapTmp = {key:key, bulan:bulan, byClass:byClass, eventsByNis:eventsByNis, kelasFilter:kelasFilter, parts:parts};
}
function cetakLayananRekap(key){
  var d = ST.cache.lpRekapTmp;
  if(!d || d.key !== key) return toast('Tampilkan rekap terlebih dahulu','er');

function filterLayanan(key){
  var fDari = $('#fDari'), fSampai = $('#fSampai'), fKelas = $('#fKelas'), fCari = $('#fCari');
  var dari = fDari ? fDari.value : '';
  var sampai = fSampai ? fSampai.value : '';
  var kelas = fKelas ? fKelas.value : '';
  var cariVal = (fCari ? fCari.value : '').toLowerCase().trim();
  var rows = (ST.cache[key]||[]).filter(function(r){ return kelasSaya().indexOf(r.Kelas)>=0; });
  if(dari)   rows = rows.filter(function(r){ return String(r.Tanggal) >= dari; });
  if(sampai) rows = rows.filter(function(r){ return String(r.Tanggal) <= sampai; });
  if(kelas)  rows = rows.filter(function(r){ return r.Kelas === kelas; });
  if(cariVal){
    rows = rows.filter(function(r){
      return (r.Nama||'').toLowerCase().indexOf(cariVal) >= 0 ||
             String(r.NIS||'').toLowerCase().indexOf(cariVal) >= 0;
    });
  }
  ST.cache['view_'+key] = rows;
  var tbl = $('#tblLayanan');
  if(tbl) tbl.innerHTML = tabelLayanan(key, rows, key==='izin');
}
function exportLayanan(key){

  var body = rows.map(function(r,i){
    return [i+1, r.Tanggal, isIzin?r.JamKeluar:r.JamDatang, r.NIS, r.Nama, r.Kelas, r.Alasan,

  });
  exportExcel('Laporan_'+(isIzin?'Perizinan':'Keterlambatan')+'_'+today(), head, body);
}

function formImportLayanan(key){
  var isIzin = key === 'izin';
  var contohHead = isIzin
    ? 'NIS, Nama, Kelas, Tanggal, JamKeluar, Alasan, JamKembali, StatusKembali, Keterangan'
    : 'NIS, Nama, Kelas, Tanggal, JamDatang, Alasan, Petugas, Keterangan';

    ? '12345, Ahmad Fauzi, X IPA 1, 2026-01-15, 09:30, Sakit, 10:30, Kembali, Sudah kembali'
    : '12345, Ahmad Fauzi, X IPA 1, 2026-01-15, 07:45, Bangun kesiangan, Pak Guru, -';
  var titleLabel = isIzin ? 'Perizinan' : 'Keterlambatan';
  openModal('📥 Import ' + titleLabel + ' dari Excel / CSV',
    '<div class="notif info"><b>Format file:</b> .xlsx, .xls, .csv, .txt — Baris pertama header.</div>'+
    '<div class="notif edit">⚠️ Data akan <b>ditambahkan</b> ke daftar yang sudah ada. Kolom <b>NIS</b> wajib ada.</div>'+
    '<div class="fg"><label>Pilih File</label>'+
      '<input type="file" id="impLayFile" accept=".csv,.txt,.xls,.xlsx">'+
      '<div class="hint">Header: <code>'+esc(contohHead)+'</code></div>'+
    '</div>'+
    '<div class="fg"><label>Atau tempel data</label>'+
      '<textarea id="impLayText" rows="6" placeholder="'+esc(contohHead)+'&#10;'+esc(contohRow)+'"></textarea>'+
    '</div>',
    '<button class="btn2" onclick="closeModal()">Batal</button>'+
    '<button class="btn" onclick="prosesImportLayanan(\''+key+'\')">📥 Import Sekarang</button>', true);
}
function prosesImportLayanan(key){
  var fEl = $('#impLayFile');
  var tEl = $('#impLayText');
  var f = fEl ? fEl.files[0] : null;
  var txt = tEl ? tEl.value : '';
  if(!f && (!txt || !txt.trim())) return toast('Pilih file atau tempel data','er');
  var kirim = function(arr){
    try{
      var records = buildLayananRecords(key, arr);
      if(!records.length) return toast('Tidak ada baris data yang valid','er');
      var sheet = key==='izin'?SH.IZIN:SH.TERLAMBAT;
      api('importLayanan', {sheet: sheet, records: records}).then(function(r){
        closeModal();
        toast(r.msg || (records.length+' data berhasil diimport'));
        ST.cache[key] = null;
        renderLayanan(key);
      }).catch(function(e){ toast(e.message,'er'); });
    }catch(err){ toast('Error: '+err.message,'er'); }
  };
  if(f){
    var name = (f.name||'').toLowerCase();
    if(name.endsWith('.xlsx') || name.endsWith('.xls')){
      toast('Membaca file…','inf');
      bacaFileMentah(f).then(kirim).catch(function(err){ toast('Gagal baca file: '+err.message,'er'); });
    } else {
      var rr = new FileReader();
      rr.onload = function(){ kirim(parseCSVText(rr.result)); };
      rr.readAsText(f, 'UTF-8');
    }
  } else {
    kirim(parseCSVText(txt));
  }
}
function buildLayananRecords(key, arr){
  if(!arr || !arr.length) return [];
  var isIzin = key === 'izin';
  var header = (arr[0]||[]).map(function(x){ return String(x||'').trim().toLowerCase(); });
  var map = {};
  header.forEach(function(h, i){
    if(map.NIS === undefined && /(^|\b|_)(nis|induk)\b/.test(h)) map.NIS = i;
    if(map.Nama === undefined && /nama/.test(h)) map.Nama = i;
    if(map.Kelas === undefined && /kelas/.test(h)) map.Kelas = i;
    if(map.Tanggal === undefined && /(tanggal|tgl|date)/.test(h)) map.Tanggal = i;
    if(isIzin){
      if(map.JamKeluar === undefined && /(jam.*keluar|keluar)/.test(h)) map.JamKeluar = i;
      if(map.JamKembali === undefined && /(jam.*kembali)/.test(h)) map.JamKembali = i;
      if(map.StatusKembali === undefined && /status/.test(h)) map.StatusKembali = i;
    } else {
      if(map.JamDatang === undefined && /(jam.*datang|jam masuk|datang|jam)/.test(h)) map.JamDatang = i;
      if(map.Petugas === undefined && /petugas/.test(h)) map.Petugas = i;
    }
    if(map.Alasan === undefined && /(alasan|keperluan|keterangan penyebab)/.test(h)) map.Alasan = i;
    if(map.Keterangan === undefined && /^(ket|keterangan)/.test(h) && map.Alasan !== i) map.Keterangan = i;
  });
  var hasHeader = map.NIS !== undefined || map.Nama !== undefined;
  var start = hasHeader ? 1 : 0;
  if(!hasHeader){
    map = isIzin
      ? {NIS:0, Nama:1, Kelas:2, Tanggal:3, JamKeluar:4, Alasan:5, JamKembali:6, StatusKembali:7, Keterangan:8}
      : {NIS:0, Nama:1, Kelas:2, Tanggal:3, JamDatang:4, Alasan:5, Petugas:6, Keterangan:7};
  }
  function cell(row, key){
    var i = map[key];
    if(i === undefined) return '';
    return String(row[i]||'').trim();
  }
  var out = [];
  for(var i=start;i<arr.length;i++){
    var row = arr[i] || [];
    var nis = cell(row, 'NIS');
    var nama = cell(row, 'Nama');
    if(!nis && !nama) continue;
    var siswa = null;
    if(nis) siswa = ST.siswa.find(function(s){ return String(s.NIS) === nis; });
    if(!siswa && nama) siswa = ST.siswa.find(function(s){ return String(s.Nama).toLowerCase() === nama.toLowerCase(); });
    var rec = {
      ID: uid(),
      NIS: nis || (siswa ? siswa.NIS : ''),
      Nama: nama || (siswa ? siswa.Nama : ''),
      Kelas: cell(row, 'Kelas') || (siswa ? siswa.Kelas : ''),
      Tanggal: normalizeDate(cell(row, 'Tanggal'))
    };
    if(isIzin){
      rec.JamKeluar = normalizeTime(cell(row, 'JamKeluar'));
      rec.JamKembali = normalizeTime(cell(row, 'JamKembali'));
      rec.Alasan = cell(row, 'Alasan');
      rec.StatusKembali = cell(row, 'StatusKembali') || (rec.JamKembali ? 'Kembali' : 'Belum');
      rec.Keterangan = cell(row, 'Keterangan');
      rec.Petugas = ST.guru ? ST.guru.Nama : 'Admin';
    } else {
      rec.JamDatang = normalizeTime(cell(row, 'JamDatang'));
      rec.Alasan = cell(row, 'Alasan');
      rec.Petugas = cell(row, 'Petugas') || (ST.guru ? ST.guru.Nama : 'Admin');
      rec.Keterangan = cell(row, 'Keterangan');
    }
    out.push(rec);
  }
  return out;
}

function extractSiswaRows(arr){
  if(!arr.length) return [];
  var firstRow = (arr[0]||[]).map(function(x){ return String(x||'').toLowerCase(); });
  var nisIdx=-1, namaIdx=-1, kelasIdx=-1, jkIdx=-1, hpIdx=-1;
  firstRow.forEach(function(h, i){
    if(nisIdx<0 && /(^|\b)(nis|induk|noinduk|no_induk)\b/.test(h)) nisIdx = i;
    if(namaIdx<0 && /nama/.test(h)) namaIdx = i;
    if(kelasIdx<0 && /kelas/.test(h)) kelasIdx = i;
    if(jkIdx<0 && /(jenis|gender|jk|l\/p|laki|perempuan)/.test(h)) jkIdx = i;
    if(hpIdx<0 && /(hp|wa|telp|telepon|kontak|handphone)/.test(h)) hpIdx = i;
  });
  var hasHeader = nisIdx >= 0 && namaIdx >= 0;
  var start = hasHeader ? 1 : 0;
  if(!hasHeader){ nisIdx = 0; namaIdx = 1; kelasIdx = 2; jkIdx = 3; hpIdx = 4; }
  var rows = [];
  for(var i=start;i<arr.length;i++){
    var row = arr[i] || [];
    var nis  = String(row[nisIdx]  || '').trim();
    var nama = String(row[namaIdx] || '').trim();
    if(!nis || !nama) continue;
    rows.push({
      NIS : nis, Nama: nama,
      Kelas: String(row[kelasIdx] || '').trim(),
      JK  : String(row[jkIdx]    || '').trim(),
      NoHP: String(row[hpIdx]    || '').trim()
    });
  }
  return rows;
}
function prosesImportSiswa(){
  var f = $('#impFile').files[0];
  var kirim = function(rows){
    if(!rows.length) return toast('Tidak ada data valid','er');
    api('importSiswa',{rows:rows}).then(function(r){
      return loadMaster().then(function(){
        closeModal();
        toast(r.msg || (rows.length+' siswa berhasil diimport'));
        renderSiswa();
      });
    }).catch(function(e){ toast(e.message,'er'); });
  };
  var parseText = function(txt){
    var lines = String(txt||'').split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
    if(!lines.length) return toast('Tidak ada data','er');
    var arr = lines.map(function(l){
      return l.split(/[,;\t]/).map(function(x){ return x.trim().replace(/^"|"$/g,''); });
    });
    var rows = extractSiswaRows(arr);
    if(!rows.length) return toast('Format data tidak dikenali','er');
    kirim(rows);
  };
  if(f){
    var name = (f.name||'').toLowerCase();
    if(name.endsWith('.xlsx') || name.endsWith('.xls')){
      toast('Membaca file…','inf');
      bacaFileMentah(f).then(function(arr){
        var rows = extractSiswaRows(arr);
        if(!rows.length) return toast('Tidak ada baris data valid','er');
        kirim(rows);
      }).catch(function(err){ toast('Gagal baca file: '+err.message,'er'); });
    } else {
      var rr = new FileReader();
      rr.onload = function(){ parseText(rr.result); };
      rr.readAsText(f, 'UTF-8');
    }
  } else {
    var t = $('#impText').value;
    if(!t.trim()) return toast('Pilih file atau tempel data','er');
    parseText(t);
  }
}

function loadMatrix(){
  var bulanEl = $('#mxBulan'), kelasEl = $('#mxKelas'), vEl = $('#mxView');
  if(!bulanEl || !kelasEl || !vEl) return;
  var bulan = bulanEl.value || '';
  var kelas = kelasEl.value || '';
  if(!bulan || !kelas){ vEl.innerHTML = '<div class="empty">Pilih bulan dan kelas.</div>'; return; }
  vEl.innerHTML = '<div class="empty">Memuat…</div>';
  getHadirRows(true).then(function(rows){
    rows = rows || [];
    var filtered = rows.filter(function(r){
      return String(r.Kelas) === kelas && String(r.Tanggal).slice(0,7) === bulan;
    });
    var parts = bulan.split('-');
    var year = +parts[0], month = +parts[1];
    var daysInMonth = new Date(year, month, 0).getDate();
    var statusMap = {};
    filtered.forEach(function(r){
      var nis = String(r.NIS);
      var day = parseInt(String(r.Tanggal).slice(8,10), 10);
      statusMap[nis] = statusMap[nis] || {};
      statusMap[nis][day] = r.Status;
    });
    var siswa = (ST.siswa||[]).filter(function(s){ return s.Kelas === kelas; })
      .sort(function(a,b){ return a.Nama.localeCompare(b.Nama); });
    if(!siswa.length){ vEl.innerHTML = '<div class="empty">Tidak ada siswa di kelas ini.</div>'; return; }
    var html = '<div class="hint" style="margin-bottom:9px">'+
      '<b>Kelas:</b> '+esc(kelas)+' &nbsp;•&nbsp; <b>Bulan:</b> '+monthName(month)+' '+year+
      '<br><span style="color:#c0392b;font-weight:700">A</span>=Alpa, '+
      '<span style="color:#b9770e">S</span>=Sakit, '+
      '<span style="color:#1a73e8">I</span>=Izin, '+
      '<span style="color:#1e8449">H</span>=Hadir, kosong = belum diinput'+
    '</div>';
    html += '<div class="tw"><table style="font-size:11px;min-width:auto">';
    html += '<thead><tr><th style="width:36px">No</th><th style="min-width:150px">Nama Siswa</th>';
    for(var d=1;d<=daysInMonth;d++) html += '<th style="text-align:center;width:26px;padding:5px 3px">'+pad2(d)+'</th>';
    html += '<th style="width:34px;text-align:center">S</th><th style="width:34px;text-align:center">I</th><th style="width:34px;text-align:center">A</th>';
    html += '</tr></thead><tbody>';
    siswa.forEach(function(s,i){
      var st = statusMap[String(s.NIS)] || {};
      html += '<tr><td>'+(i+1)+'</td><td>'+esc(s.Nama)+'</td>';
      var cS=0,cI=0,cA=0;
      for(var d=1;d<=daysInMonth;d++){
        var v = st[d] || '';
        if(v === 'S') cS++;
        else if(v === 'I') cI++;
        else if(v === 'A') cA++;
        var colorStyle = '';
        if(v === 'A') colorStyle = 'color:#c0392b;font-weight:700';
        else if(v === 'S') colorStyle = 'color:#b9770e';
        else if(v === 'I') colorStyle = 'color:#1a73e8';
        else if(v === 'H') colorStyle = 'color:#1e8449';
        html += '<td style="text-align:center;padding:5px 3px;'+colorStyle+'">'+esc(v||'')+'</td>';
      }
      html += '<td style="text-align:center">'+cS+'</td><td style="text-align:center">'+cI+'</td><td style="text-align:center;font-weight:700">'+cA+'</td></tr>';
    });
    html += '</tbody></table></div>';
    vEl.innerHTML = html;
    ST.cache.matrix = {
      bulan: bulan, kelas: kelas, year: year, month: month,
      daysInMonth: daysInMonth, siswa: siswa, statusMap: statusMap
    };
  }).catch(function(e){ toast('Gagal memuat absen bulanan: ' + (e.message || e),'er'); });
}

  html += '<th>S</th><th>I</th><th>A</th></tr></thead><tbody>';
  d.siswa.forEach(function(s,idx){

function bacaFileMentah(file){
  return new Promise(function(resolve, reject){
    if(!file){ reject(new Error('Tidak ada file')); return; }
    var name = (file.name||'').toLowerCase();
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('Gagal membaca file')); };
    reader.onload = function(ev){
      var result = ev.target.result;
      try{
        if(typeof result === 'string'){
          var txt = result.replace(/^\ufeff/, '');
          if(/<\s*table|<\s*html|<!DOCTYPE/i.test(txt)) resolve(parseHTMLTable(txt));
          else resolve(parseCSVText(txt));
          return;
        }
        var bytes = new Uint8Array(result);
        if(bytes.length === 0){ reject(new Error('File kosong')); return; }
        var preview = '';
        var maxCheck = Math.min(bytes.length, 2048);
        for(var i=0;i<maxCheck;i++) preview += String.fromCharCode(bytes[i]);
        if(/<\s*table|<\s*html|<!DOCTYPE/i.test(preview)){
          try{
            var text = new TextDecoder('utf-8').decode(bytes);
            resolve(parseHTMLTable(text));
          }catch(err){ reject(new Error('File HTML gagal dibaca')); }
          return;
        }
        ensureXLSXLoaded().then(function(XLSX){
          try{
            var wb = XLSX.read(bytes, {type:'array'});
            if(!wb || !wb.SheetNames || !wb.SheetNames.length) return reject(new Error('Excel tidak memiliki sheet'));
            var ws = wb.Sheets[wb.SheetNames[0]];
            var arr = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
            resolve(arr);
          }catch(err){
            try{
              var wb2 = XLSX.read(bytes, {type:'array', raw:true});
              var ws2 = wb2.Sheets[wb2.SheetNames[0]];
              var arr2 = XLSX.utils.sheet_to_json(ws2, {header:1, raw:false, defval:''});
              resolve(arr2);
            }catch(err2){ reject(new Error('Format file tidak dikenali. Gunakan .xlsx/.csv')); }
          }
        }).catch(reject);
      }catch(e){ reject(e); }
    };
    if(name.endsWith('.csv') || name.endsWith('.txt')) reader.readAsText(file, 'UTF-8');
    else reader.readAsArrayBuffer(file);
  });
}
function parseHTMLTable(html){
  var doc;
  try{ doc = new DOMParser().parseFromString(html, 'text/html'); }
  catch(e){ throw new Error('Gagal parsing HTML: ' + e.message); }
  var table = doc.querySelector('table');
  if(!table) throw new Error('Tabel tidak ditemukan dalam file');
  var rows = [];
  var trs = table.querySelectorAll('tr');
  for(var i=0;i<trs.length;i++){
    var cells = trs[i].querySelectorAll('th, td');
    var row = [];
    for(var j=0;j<cells.length;j++) row.push((cells[j].textContent||'').trim());
    if(row.length) rows.push(row);
  }
  return rows;
}
function parseCSVText(text){
  text = String(text||'').replace(/^\ufeff/, '');
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
  return lines.map(function(l){
    var result = [];
    var cur = '';
    var inQuote = false;
    for(var i=0;i<l.length;i++){
      var c = l[i];
      if(c === '"'){
        if(inQuote && l[i+1] === '"'){ cur += '"'; i++; }
        else inQuote = !inQuote;
      } else if((c === ',' || c === ';' || c === '\t') && !inQuote){
        result.push(cur.trim()); cur = '';
      } else { cur += c; }
    }
    result.push(cur.trim());
    return result;
  });
}
function parseAbsenArray(arr, kelas){
  var result = { rows: [], unmatched: [], totalEntries: 0, warnings: [] };
  if(!arr || !arr.length) throw new Error('File tidak memiliki data');
  var header = (arr[0]||[]).map(function(x){ return String(x||'').trim(); });
  var headerLower = header.map(function(x){ return x.toLowerCase(); });
  var nisIdx = -1, namaIdx = -1;
  headerLower.forEach(function(h, i){
    if(nisIdx<0 && /(^|\b|_)(nis|induk|nomor\s*induk|no[\.\s_-]?induk)\b/.test(h)) nisIdx = i;
    if(namaIdx<0 && /nama/.test(h)) namaIdx = i;
  });
  var dateCols = [];
  var skipHeaderRegex = /^(no|nomor|#|s|i|a|total|jumlah|sakit|izin|alpa|hadir|keterangan|ket|nis|nama)$/i;
  header.forEach(function(h, i){
    var hh = String(h).trim();
    if(skipHeaderRegex.test(hh)) return;
    var m = hh.match(/(?:^|[^\d])(\d{1,2})(?:[^\d]|$)/);
    if(m){
      var n = parseInt(m[1], 10);
      if(n >= 1 && n <= 31){
        if(i === nisIdx || i === namaIdx) return;
        if(!dateCols.some(function(dc){ return dc.day === n; })) dateCols.push({index: i, day: n});
      }
    }
  });
  dateCols.sort(function(a,b){ return a.day - b.day; });
  if(!dateCols.length){
    var startIdx = 1;
    if(nisIdx >= 0)  startIdx = Math.max(startIdx, nisIdx+1);
    if(namaIdx >= 0) startIdx = Math.max(startIdx, namaIdx+1);
    var dayCounter = 1;
    for(var i=startIdx;i<header.length;i++){
      var hh2 = String(header[i]||'').trim();
      if(skipHeaderRegex.test(hh2)) break;
      if(hh2 === '') continue;
      dateCols.push({index: i, day: dayCounter++});
      if(dayCounter > 31) break;
    }
    if(dateCols.length) result.warnings.push('Kolom tanggal tidak terdeteksi dari header, menggunakan urutan kolom 1-'+dateCols.length);
  }
  if(!dateCols.length) throw new Error('Kolom tanggal (1-31) tidak terdeteksi pada header');
  var siswaKelas = (ST.siswa||[]).filter(function(s){ return String(s.Kelas) === String(kelas); });
  if(!siswaKelas.length) throw new Error('Tidak ada siswa terdaftar di kelas "'+kelas+'"');
  for(var i=1;i<arr.length;i++){
    var row = arr[i] || [];
    var hasAny = row.some(function(c){ return String(c||'').trim() !== ''; });
    if(!hasAny) continue;
    var nis  = nisIdx >= 0  ? String(row[nisIdx]||'').trim()  : '';
    var nama = namaIdx >= 0 ? String(row[namaIdx]||'').trim() : '';
    if(!nis && !nama){
      for(var j=0;j<Math.min(row.length, 5);j++){
        var v = String(row[j]||'').trim();
        if(!v) continue;
        if(!nis && /^\d{3,}$/.test(v)) { nis = v; continue; }
        if(!nama && /[a-zA-Z\u00C0-\u024F]/.test(v) && !/^\d+$/.test(v)) { nama = v; }
      }
    }
    var siswa = null;
    if(nis) siswa = siswaKelas.find(function(s){ return String(s.NIS) === nis; });
    if(!siswa && nama){
      var nm = nama.toLowerCase().trim();
      siswa = siswaKelas.find(function(s){ return String(s.Nama||'').toLowerCase().trim() === nm; });
      if(!siswa && nm.length >= 3){
        siswa = siswaKelas.find(function(s){ return String(s.Nama||'').toLowerCase().indexOf(nm) >= 0; });
      }
    }
    if(!siswa){ result.unmatched.push((nama || nis || '(baris '+(i+1)+')')); continue; }
    var statuses = {};
    dateCols.forEach(function(dc){
      var raw = String(row[dc.index]||'').trim().toUpperCase();
      var v = '';
      if(/^(H|HADIR|V|✓|√|Y|YA|1|√)$/.test(raw)) v = 'H';
      else if(/^(S|SAKIT|SAK)$/.test(raw)) v = 'S';
      else if(/^(I|IZIN|IDZIN)$/.test(raw)) v = 'I';
      else if(/^(A|ALPA|ALPHA|TK|TANPA KETERANGAN|X|-$)/.test(raw)) v = 'A';
      if(v) statuses[String(dc.day)] = v;
    });
    if(Object.keys(statuses).length){
      result.rows.push({ NIS: siswa.NIS, Nama: siswa.Nama, statuses: statuses });
      result.totalEntries += Object.keys(statuses).length;
    }
  }
  return result;
}

function prosesImportAbsenBulanan(){
  var kelasEl = $('#iaKelas');
  var bulanEl = $('#iaBulan');
  var kelas = kelasEl ? kelasEl.value : '';
  var bulan = bulanEl ? bulanEl.value : '';
  if(!kelas) return toast('Pilih kelas terlebih dahulu','er');
  if(!bulan) return toast('Pilih bulan terlebih dahulu','er');
  var fileEl = $('#iaFile');
  var textEl = $('#iaText');
  var f = fileEl ? fileEl.files[0] : null;
  var txt = textEl ? textEl.value : '';
  if(!f && (!txt || !txt.trim())) return toast('Pilih file atau tempel data terlebih dahulu','er');
  var btn = event && event.target;
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Memproses…'; }
  var proses = function(rowsArr){
    try{
      var parsed = parseAbsenArray(rowsArr, kelas);
      if(!parsed.rows.length){
        var msg = 'Tidak ada baris yang cocok dengan siswa kelas '+kelas+'.';
        if(parsed.unmatched.length) msg += ' Contoh: ' + parsed.unmatched.slice(0,3).join(', ');
        toast(msg, 'er');
        if(btn){ btn.disabled = false; btn.textContent = '📥 Proses & Pratinjau'; }
        return;
      }
      tampilkanPreviewImport(parsed, kelas, bulan);
    }catch(err){
      toast('Error: ' + err.message, 'er');
      if(btn){ btn.disabled = false; btn.textContent = '📥 Proses & Pratinjau'; }
    }
  };
  if(f){
    toast('Membaca file…', 'inf');
    bacaFileMentah(f).then(proses).catch(function(err){
      toast('Gagal membaca file: ' + err.message, 'er');
      if(btn){ btn.disabled = false; btn.textContent = '📥 Proses & Pratinjau'; }
    });
  } else {
    try{ proses(parseCSVText(txt)); }
    catch(err){
      toast('Gagal parse teks: ' + err.message, 'er');
      if(btn){ btn.disabled = false; btn.textContent = '📥 Proses & Pratinjau'; }
    }
  }
}

    '<div class="fg"><label>Pratinjau Siswa yang akan Diimport ('+parsed.rows.length+')</label>'+

function loadKhRawan(){
  var rwDariEl = $('#rwDari'), rwSampaiEl = $('#rwSampai'), rwKelasEl = $('#rwKelas'), rwJenisEl = $('#rwJenis'), vEl = $('#rwView');
  if(!vEl) return;
  var dari = rwDariEl ? rwDariEl.value : '';
  var sampai = rwSampaiEl ? rwSampaiEl.value : '';
  var kelas = rwKelasEl ? rwKelasEl.value : '';
  var jenis = rwJenisEl ? rwJenisEl.value : '';
  ST.cache.khRawanJenis = jenis;
  vEl.innerHTML = '<div class="empty">Memuat…</div>';
  getHadirRows().then(function(rows){
    rows = rows || [];
    var ks = kelasSaya();
    var r = rows.filter(function(x){ return ks.indexOf(x.Kelas) >= 0; });
    if(dari)   r = r.filter(function(x){ return String(x.Tanggal) >= dari; });
    if(sampai) r = r.filter(function(x){ return String(x.Tanggal) <= sampai; });
    if(kelas)  r = r.filter(function(x){ return x.Kelas === kelas; });
    var agg = {};
    r.filter(function(x){ return x.Status !== 'H'; }).forEach(function(x){
      var k = x.NIS;
      agg[k] = agg[k] || {NIS:x.NIS, Nama:x.Nama, Kelas:x.Kelas, S:0, I:0, A:0, total:0};
      agg[k][x.Status] = (agg[k][x.Status]||0)+1;
      agg[k].total++;
    });
    var rawan = Object.keys(agg).map(function(k){ return agg[k]; });
    rawan = filterRawanByJenis(rawan, jenis);
    rawan = sortRawanByJenis(rawan, jenis);
    if(!rawan.length){
      vEl.innerHTML = '<div class="empty">Tidak ada siswa rawan'+(jenis?' dengan kategori '+esc(jenisLabelOf(jenis)):'')+'. 👍</div>';
      ST.cache.khRawanTmp = {rawan:[], dari:dari, sampai:sampai, kelas:kelas, jenis:jenis};
      return;
    }
    var jumlahJenis = rawan.reduce(function(a,b){
      if(jenis === 'S') return a + (b.S||0);
      if(jenis === 'I') return a + (b.I||0);
      if(jenis === 'A') return a + (b.A||0);
      return a + b.total;
    }, 0);
    var statsHTML = '<div class="stat">'+
      '<div class="sc r"><div class="n">'+rawan.length+'</div><div class="l">Siswa Rawan'+(jenis?' ('+esc(jenisLabelOf(jenis))+')':'')+'</div></div>'+
      '<div class="sc p"><div class="n">'+jumlahJenis+'</div><div class="l">'+(jenis?'Total '+esc(jenisLabelOf(jenis)):'Total Ketidakhadiran')+'</div></div>'+
      '</div>';
    var infoJenis = jenis ? '<div class="hint" style="margin-bottom:9px">🎯 <b>Filter aktif:</b> '+esc(jenisLabelOf(jenis))+' — hanya menampilkan siswa dengan kategori ini. Diurutkan berdasarkan jumlah '+esc(jenisLabelOf(jenis))+' terbanyak.</div>' : '';
    var html = statsHTML + infoJenis +
      '<div class="tw"><table><thead><tr>'+
      '<th style="width:44px">No</th><th>NIS</th><th>Nama</th><th>Kelas</th>'+
      '<th>Sakit</th><th>Izin</th><th>Alpa</th><th>Total</th>'+
      '<th style="min-width:340px">Penanganan Berjenjang</th>'+
      '</tr></thead><tbody>'+
      rawan.map(function(x,i){
        var tier = tierNumFromPenanganan(penangananRawan(x.A, x.total));
        var rowCls = rawanRowClass(tier);
        var siswa = ST.siswa.find(function(s){ return String(s.NIS) === String(x.NIS); });
        var wa = '';
        if(siswa && siswa.NoHP){
          wa = '<a class="btn-wa" style="margin-left:6px" href="'+esc(waLink(x.Nama, siswa.NoHP, 'Assalamualaikum ' + x.Nama + ', '))+'" target="_blank">💬</a>';
        }
        var sCell = jenis === 'S' ? '<td style="color:#b9770e;font-weight:800;background:#fffaf0">'+x.S+'</td>' : '<td style="color:#b9770e">'+x.S+'</td>';
        var iCell = jenis === 'I' ? '<td style="color:#1a73e8;font-weight:800;background:#f0f6ff">'+x.I+'</td>' : '<td style="color:#1a73e8">'+x.I+'</td>';
        var aCell = jenis === 'A' ? '<td style="color:#c0392b;font-weight:800;background:#fff5f5">'+x.A+'</td>' : '<td style="color:#c0392b"><b>'+x.A+'</b></td>';
        return '<tr class="'+rowCls+'"><td>'+(i+1)+'</td><td>'+esc(x.NIS)+'</td><td><b>'+esc(x.Nama)+'</b>'+wa+'</td>'+
          '<td>'+esc(x.Kelas)+'</td>'+sCell+iCell+aCell+
          '<td>'+x.total+'</td>'+
          '<td>'+tierBadge(penangananRawan(x.A, x.total), tierRangeInfo('kehadiran', tier))+'</td></tr>';
      }).join('')+
      '</tbody></table></div>'+
      '<div class="hint" style="margin-top:9px">💡 Tier 1 (Wali Kelas) → Tier 2 (Wali Kelas + Guru BK) → Tier 3 (Panggilan Orang Tua) → Tier 4 (Disiplin/Kepsek).</div>';
    vEl.innerHTML = html;
    ST.cache.khRawanTmp = {rawan:rawan, dari:dari, sampai:sampai, kelas:kelas, jenis:jenis};
  }).catch(function(e){ toast('Gagal memuat: ' + (e.message || e),'er'); });
}
